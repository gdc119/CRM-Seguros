// Condición de búsqueda por texto (n° de póliza, patente o nombre del cliente)
async function condicionTextoPolizas() {
  const texto = filtroPol.texto.replace(/[,()*%\\]/g, ' ').trim();
  if (!texto) return null;
  let porNombre = db.from('clientes').select('id').limit(100);
  texto.split(/\s+/).forEach((palabra) => { porNombre = porNombre.ilike('nombre_mostrar', `%${palabra}%`); });
  const { data: clientesEncontrados } = await porNombre;
  const condiciones = [
    `numero_poliza.ilike.%${texto}%`,
    `patente.ilike.%${texto.replace(/[\s-]/g, '')}%`,
  ];
  const ids = (clientesEncontrados || []).map((c) => c.id);
  if (ids.length) condiciones.push(`cliente_id.in.(${ids.join(',')})`);
  return condiciones.join(',');
}

function consultaPolizas(columnas, condicionTexto) {
  const hoy = hoyISO();
  let q = db.from('polizas').select(columnas)
    .order('fecha_vencimiento', { ascending: true }).order('id');
  if (filtroPol.compania) q = q.eq('compania_id', filtroPol.compania);
  if (filtroPol.ramo) q = q.eq('ramo_id', filtroPol.ramo);
  if (filtroPol.estado) q = q.eq('estado', filtroPol.estado);
  q = filtrarCartera(q, filtroPol.cartera);
  if (filtroPol.vence === 'vencidas') {
    q = q.lt('fecha_vencimiento', hoy);
  } else if (filtroPol.vence === 'mes') {
    const f = new Date();
    q = q.gte('fecha_vencimiento', aISO(new Date(f.getFullYear(), f.getMonth(), 1)))
         .lte('fecha_vencimiento', aISO(new Date(f.getFullYear(), f.getMonth() + 1, 0)));
  } else if (filtroPol.vence) {
    q = q.gte('fecha_vencimiento', hoy).lte('fecha_vencimiento', sumarDias(hoy, Number(filtroPol.vence)));
  }
  if (condicionTexto) q = q.or(condicionTexto);
  return q;
}

async function buscarPolizas() {
  const miBusqueda = ++numeroBusquedaPol;
  const condicion = await condicionTextoPolizas();
  if (miBusqueda !== numeroBusquedaPol) return;
  let q = consultaPolizas('*, clientes(nombre_mostrar, telefono, dni_cuit), companias(nombre), ramos(nombre)', condicion).limit(500);

  const { data, error } = await q;
  if (miBusqueda !== numeroBusquedaPol) return;
  const caja = $('lista-polizas');
  if (!caja) return;

  if (error) {
    caja.innerHTML = `<div class="vacio"><div class="mensaje-error">${escapar(errorDB(error))}</div></div>`;
    return;
  }
  if (data.length === 0) {
    caja.innerHTML = vacio('📄', 'No hay pólizas que coincidan con estos filtros.');
    return;
  }

  const filas = data.map((p) => `
    <tr class="fila-click" data-accion="ver-cliente" data-id="${p.cliente_id}">
      <td>${chipPoliza(p)}</td>
      <td><strong>${escapar(p.clientes?.nombre_mostrar)}</strong></td>
      <td>${escapar(p.companias?.nombre)}</td>
      <td>${escapar(p.ramos?.nombre)}</td>
      <td>${escapar(p.numero_poliza) || '-'}</td>
      <td>${escapar(descripcionBien(p)) || '-'}</td>
      <td>${formatearFecha(p.fecha_vencimiento)}</td>
      <td>${NOMBRES_PAGO[p.forma_pago] || '-'}</td>
    </tr>`).join('');

  caja.innerHTML = `
    <div class="tabla-contenedor"><table>
      <thead><tr><th>Estado</th><th>Cliente</th><th>Compañía</th><th>Tipo de seguro</th><th>N° póliza</th><th>Bien asegurado</th><th>Vencimiento</th><th>Pago</th></tr></thead>
      <tbody>${filas}</tbody>
    </table></div>
    <div class="pie-tabla">${data.length === 500 ? 'Mostrando las primeras 500. Usá los filtros para achicar la lista.' : `${data.length} póliza${data.length === 1 ? '' : 's'}`}</div>`;
}

async function exportarPolizas() {
  const boton = document.querySelector('[data-accion="exportar-polizas"]');
  try {
    if (boton) { boton.disabled = true; boton.textContent = '⬇️ Preparando...'; }
    const condicion = await condicionTextoPolizas();
    const polizas = await traerTodos(() => consultaPolizas('*, clientes(*)', condicion));
    if (polizas.length === 0) { alert('No hay pólizas para exportar con estos filtros.'); return; }
    await descargarCartera('polizas', polizas.map((p) => ({ cliente: p.clientes || {}, poliza: p })));
  } catch (e) {
    alert('No se pudo exportar: ' + (e.code ? errorDB(e) : e.message || e));
  } finally {
    if (boton) { boton.disabled = false; boton.textContent = '⬇️ Exportar a Excel'; }
  }
}

// =====================================================================
//  SECCIÓN: VENTAS EN CURSO (tablero por etapas)
// =====================================================================
const ETAPAS = [
  { id: 'contacto',   nombre: 'Contacto',   color: '#94a3b8' },
  { id: 'cotizado',   nombre: 'Cotizado',   color: '#3b82f6' },
  { id: 'negociando', nombre: 'Negociando', color: '#f59e0b' },
  { id: 'ganado',     nombre: 'Ganado 🎉',  color: '#16a34a' },
  { id: 'perdido',    nombre: 'Perdido',    color: '#dc2626' },
];
const DIAS_CERRADAS = 60; // ganadas/perdidas: se muestran las de los últimos 60 días
let ventas = [];
let proximasAcciones = {}; // id de venta -> próxima anotación pendiente en la agenda
const nombreVenta = (o) => o.clientes?.nombre_mostrar || o.prospecto_nombre || 'Sin nombre';

const formatoPlata = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 });

async function dibujarVentas() {
  $('contenido').innerHTML = `
    <div class="cabecera-seccion">
      <div>
        <h1 class="titulo-seccion">Ventas en curso</h1>
        <p class="bajada">Arrastrá las tarjetas de una columna a otra (o usá las flechitas) a medida que avanza cada venta</p>
      </div>
      <button class="btn-principal btn-chico" data-accion="nueva-venta">+ Nueva venta</button>
    </div>
    <div id="tablero"><div class="vacio">Cargando...</div></div>`;
  await cargarVentas();
}

async function cargarVentas() {
  const desde = sumarDias(hoyISO(), -DIAS_CERRADAS);
  const { data, error } = await db.from('oportunidades')
    .select('*, clientes(nombre_mostrar)')
    .or(`etapa.in.(contacto,cotizado,negociando),updated_at.gte.${desde}`)
    .order('fecha_cierre_estimada', { ascending: true, nullsFirst: false })
    .order('created_at', { ascending: true });

  const caja = $('tablero');
  if (!caja) return;
  if (error) {
    caja.innerHTML = `<div class="mensaje-error">${escapar(errorDB(error))}</div>`;
    return;
  }
  // Próxima acción agendada de cada venta
  proximasAcciones = {};
  const ids = data.map((o) => o.id);
  if (ids.length) {
    const { data: acciones } = await db.from('agenda')
      .select('oportunidad_id, fecha, hora, titulo')
      .eq('completado', false)
      .in('oportunidad_id', ids)
      .order('fecha', { ascending: true })
      .order('hora', { ascending: true, nullsFirst: true });
    (acciones || []).forEach((a) => {
      if (!proximasAcciones[a.oportunidad_id]) proximasAcciones[a.oportunidad_id] = a;
    });
  }

  ventas = data;
  if ($('tablero')) dibujarTablero();
}

function htmlTarjetaVenta(o, indiceEtapa) {
  const hoy = hoyISO();
  const abierta = indiceEtapa < 3;
  const atrasada = abierta && o.fecha_cierre_estimada && o.fecha_cierre_estimada < hoy;
  const ramo = ramos.find((r) => r.id === o.ramo_id)?.nombre;
  const compania = companias.find((c) => c.id === o.compania_id)?.nombre;
  const anterior = indiceEtapa > 0 ? ETAPAS[indiceEtapa - 1] : null;
  const siguiente = indiceEtapa < ETAPAS.length - 1 ? ETAPAS[indiceEtapa + 1] : null;

  const quien = o.cliente_id
    ? `<div class="tv-cliente">👤 ${escapar(nombreVenta(o))}</div>`
    : `<div class="tv-cliente">🙋 ${escapar(nombreVenta(o))} <span class="tv-interesado">interesado</span></div>
       ${o.prospecto_telefono ? `<div class="tv-telefono">📞 ${escapar(o.prospecto_telefono)}</div>` : ''}`;

  const accion = proximasAcciones[o.id];
  let accionHTML = '';
  if (accion) {
    const atrasadaAccion = accion.fecha < hoy;
    const cuando = accion.fecha === hoy ? 'Hoy' : formatearFecha(accion.fecha).slice(0, 5);
    accionHTML = `<div class="tv-accion ${atrasadaAccion ? 'atrasada' : ''}">📒 ${cuando}${accion.hora ? ' ' + horaCorta(accion.hora) : ''} · ${escapar(accion.titulo)}</div>`;
  } else if (abierta) {
    accionHTML = '<div class="tv-sin-accion">⚠️ Sin próxima acción agendada</div>';
  }

  return `
    <div class="tarjeta-venta" draggable="true" data-accion="editar-venta" data-id="${o.id}">
      <div class="tv-titulo">${escapar(o.titulo)}</div>
      ${quien}
      <div class="tv-meta">
        ${o.monto_estimado ? `<span class="tv-monto">${formatoPlata.format(o.monto_estimado)}</span>` : ''}
        ${ramo ? `<span>${escapar(ramo)}</span>` : ''}
        ${compania ? `<span>${escapar(compania)}</span>` : ''}
        ${o.fecha_cierre_estimada ? `<span class="${atrasada ? 'tv-atrasada' : ''}">${atrasada ? '⚠️ ' : '📅 '}${formatearFecha(o.fecha_cierre_estimada)}</span>` : ''}
      </div>
      ${o.etapa === 'perdido' && o.motivo_perdida ? `<div class="tv-motivo">${escapar(o.motivo_perdida)}</div>` : ''}
      ${accionHTML}
      <div class="tv-mover">
        ${anterior ? `<button data-accion="mover-venta" data-id="${o.id}" data-etapa="${anterior.id}" title="Mover a ${anterior.nombre}">‹ ${anterior.nombre.split(' ')[0]}</button>` : '<span></span>'}
        <button data-accion="agendar-venta" data-id="${o.id}" title="Agendar una acción">📒 Agendar</button>
        ${siguiente ? `<button data-accion="mover-venta" data-id="${o.id}" data-etapa="${siguiente.id}" title="Mover a ${siguiente.nombre}">${siguiente.nombre.split(' ')[0]} ›</button>` : ''}
      </div>
    </div>`;
}

function dibujarTablero() {
  const caja = $('tablero');
  if (!caja) return;

  const columnas = ETAPAS.map((etapa, i) => {
    const deEstaEtapa = ventas.filter((o) => o.etapa === etapa.id);
    const total = deEstaEtapa.reduce((suma, o) => suma + (Number(o.monto_estimado) || 0), 0);
    return `
      <div class="columna" data-etapa="${etapa.id}" style="--color-etapa:${etapa.color}">
        <div class="columna-cabecera">
          <div class="columna-nombre">${etapa.nombre} <span class="columna-cantidad">${deEstaEtapa.length}</span></div>
          ${total ? `<div class="columna-total">${formatoPlata.format(total)}</div>` : ''}
        </div>
        ${deEstaEtapa.map((o) => htmlTarjetaVenta(o, i)).join('') || '<div class="columna-vacia">Sin ventas acá</div>'}
      </div>`;
  }).join('');

  caja.innerHTML = `<div class="tablero">${columnas}</div>
    <p class="pie-tabla">Ganadas y perdidas: se muestran las de los últimos ${DIAS_CERRADAS} días.</p>`;

  // Arrastrar y soltar
  caja.querySelectorAll('.tarjeta-venta').forEach((t) => {
    t.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', t.dataset.id);
      t.classList.add('arrastrando');
    });
    t.addEventListener('dragend', () => t.classList.remove('arrastrando'));
  });
  caja.querySelectorAll('.columna').forEach((col) => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('recibiendo'); });
    col.addEventListener('dragleave', (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove('recibiendo'); });
    col.addEventListener('drop', (e) => {
      e.preventDefault();
      col.classList.remove('recibiendo');
      const id = e.dataTransfer.getData('text/plain');
      if (id) moverVenta(id, col.dataset.etapa);
    });
  });
}

async function moverVenta(id, etapaNueva) {
  const o = ventas.find((x) => x.id === id);
  if (!o || o.etapa === etapaNueva) return;

  const cambios = { etapa: etapaNueva };
  if (etapaNueva === 'perdido') {
    const motivo = prompt('¿Por qué se perdió esta venta? (opcional)\nEj: le pareció caro, se fue con otro productor...', o.motivo_perdida || '');
    if (motivo === null) return; // canceló
    cambios.motivo_perdida = motivo.trim() || null;
  }

  // Se mueve en pantalla al instante, y después se guarda
  const etapaAnterior = o.etapa;
  o.etapa = etapaNueva;
  dibujarTablero();

  const { error } = await db.from('oportunidades').update(cambios).eq('id', id);
  if (error) {
    o.etapa = etapaAnterior;
    dibujarTablero();
    alert('No se pudo mover: ' + errorDB(error));
    return;
  }
  if (cambios.motivo_perdida !== undefined) o.motivo_perdida = cambios.motivo_perdida;

  if (etapaNueva !== 'ganado') return;

  if (o.cliente_id) {
    if (confirm('¡Venta ganada! 🎉\n\n¿Querés cargar la póliza ahora en la ficha del cliente?')) {
      await verCliente(o.cliente_id);
      abrirFormPoliza(null, { compania_id: o.compania_id, ramo_id: o.ramo_id, bien_asegurado: o.titulo });
    }
  } else if (confirm(`¡Venta ganada! 🎉\n\n${o.prospecto_nombre} todavía no es cliente.\n¿Lo cargamos como cliente ahora? (los datos que ya tenés se completan solos)`)) {
    convertirEnCliente(o);
  }
}

// Pasa un interesado a cliente, une la venta y sus anotaciones al cliente nuevo
// y ofrece cargar la póliza
function convertirEnCliente(o) {
  const partes = (o.prospecto_nombre || '').trim().split(/\s+/);
  abrirFormCliente(null, {
    nombre: partes[0] || '',
    apellido: partes.slice(1).join(' '),
    telefono: o.prospecto_telefono,
    email: o.prospecto_email,
    onCreado: async (clienteId) => {
      await Promise.all([
        db.from('oportunidades').update({ cliente_id: clienteId }).eq('id', o.id),
        db.from('agenda').update({ cliente_id: clienteId }).eq('oportunidad_id', o.id),
      ]);
      await verCliente(clienteId);
      abrirFormPoliza(null, { compania_id: o.compania_id, ramo_id: o.ramo_id, bien_asegurado: o.titulo });
    },
  });
}

async function abrirFormVenta(o = null, clienteFijo = null) {
  // Si la venta ya tiene cliente (o se crea desde la ficha de un cliente), el cliente queda fijo
  const fijo = o && o.cliente_id
    ? { id: o.cliente_id, nombre: o.clientes?.nombre_mostrar }
    : clienteFijo;

  let listaClientes = [];
  if (!fijo) {
    const { data } = await db.from('clientes').select('id, nombre_mostrar, dni_cuit').order('nombre_mostrar').limit(3000);
    listaClientes = data || [];
  }
  const etiquetaCliente = (c) => (c.dni_cuit ? `${c.nombre_mostrar} — ${c.dni_cuit}` : c.nombre_mostrar);

  const bloqueQuien = fijo
    ? `<div class="campo"><label>Cliente</label><input value="${escapar(fijo.nombre)}" disabled></div>`
    : `
      <div class="selector-tipo">
        <label><input type="radio" name="quien" value="interesado" checked> 🙋 Todavía no es cliente</label>
        <label><input type="radio" name="quien" value="cliente" ${listaClientes.length ? '' : 'disabled'}> 👤 Ya es cliente</label>
      </div>
      <div data-quien="interesado">
        <div class="fila-3">
          <div class="campo"><label>Nombre del interesado *</label>
            <input name="prospecto_nombre" maxlength="150" value="${escapar(o?.prospecto_nombre)}" placeholder="Ej: María González">
          </div>
          <div class="campo"><label>Teléfono</label><input name="prospecto_telefono" type="tel" value="${escapar(o?.prospecto_telefono)}"></div>
          <div class="campo"><label>Email</label><input name="prospecto_email" type="email" value="${escapar(o?.prospecto_email)}"></div>
        </div>
      </div>
      <div data-quien="cliente">
        <div class="campo"><label>Cliente *</label>
          <input name="cliente" list="lista-clientes-venta" placeholder="Empezá a escribir el nombre o DNI..." autocomplete="off">
          <datalist id="lista-clientes-venta">${listaClientes.map((c) => `<option value="${escapar(etiquetaCliente(c))}"></option>`).join('')}</datalist>
        </div>
      </div>`;

  abrirModal({
    titulo: o ? 'Editar venta' : 'Nueva venta',
    ancho: true,
    cuerpo: `
      ${bloqueQuien}
      <div class="campo"><label>¿Qué se está vendiendo? *</label>
        <input name="titulo" required maxlength="200" value="${escapar(o?.titulo)}" placeholder="Ej: Seguro auto Toyota Corolla 2022">
      </div>
      <div class="fila-2">
        <div class="campo"><label>Tipo de seguro</label><select name="ramo_id">${opciones(ramos.filter((r) => r.activo || r.id === o?.ramo_id), o?.ramo_id, '-')}</select></div>
        <div class="campo"><label>Compañía</label><select name="compania_id">${opciones(companias.filter((c) => c.activa || c.id === o?.compania_id), o?.compania_id, 'Todavía no definida')}</select></div>
      </div>
      <div class="fila-3">
        <div class="campo"><label>Monto estimado ($)</label><input name="monto_estimado" type="number" min="0" step="1" value="${escapar(o?.monto_estimado)}" placeholder="Ej: 85000"></div>
        <div class="campo"><label>Cierre estimado</label><input name="fecha_cierre_estimada" type="date" value="${escapar(o?.fecha_cierre_estimada)}"></div>
        <div class="campo"><label>Etapa</label><select name="etapa">${ETAPAS.map((e) => `<option value="${e.id}" ${sel(e.id, o?.etapa || 'contacto')}>${e.nombre}</option>`).join('')}</select></div>
      </div>
      <div class="campo" id="campo-motivo"><label>¿Por qué se perdió?</label><input name="motivo_perdida" value="${escapar(o?.motivo_perdida)}"></div>
      <div class="campo"><label>Notas</label><textarea name="notas" rows="2">${escapar(o?.notas)}</textarea></div>`,

    onGuardar: async (d) => {
      if (!v(d, 'titulo')) return 'Escribí qué se está vendiendo.';

      const datos = {
        titulo: v(d, 'titulo'),
        ramo_id: d.ramo_id ? Number(d.ramo_id) : null,
        compania_id: d.compania_id ? Number(d.compania_id) : null,
        monto_estimado: d.monto_estimado ? Number(d.monto_estimado) : null,
        fecha_cierre_estimada: v(d, 'fecha_cierre_estimada'),
        etapa: d.etapa,
        motivo_perdida: d.etapa === 'perdido' ? v(d, 'motivo_perdida') : null,
        notas: v(d, 'notas'),
      };

      if (fijo) {
        datos.cliente_id = fijo.id;
      } else if (d.quien === 'cliente') {
        const elegido = listaClientes.find((c) => etiquetaCliente(c) === (d.cliente || '').trim());
        if (!elegido) return 'Elegí el cliente de la lista que aparece al escribir.';
        datos.cliente_id = elegido.id;
      } else {
        datos.cliente_id = null;
        datos.prospecto_nombre = v(d, 'prospecto_nombre');
        datos.prospecto_telefono = v(d, 'prospecto_telefono');
        datos.prospecto_email = v(d, 'prospecto_email');
        if (!datos.prospecto_nombre) return 'Escribí el nombre del interesado.';
      }

      const { error } = o
        ? await db.from('oportunidades').update(datos).eq('id', o.id)
        : await db.from('oportunidades').insert(datos);
      if (error) return errorDB(error);

      if (seccionActual === 'ventas') cargarVentas();
      else if (clienteFijo) alert('Venta creada ✅. La vas a ver en "Ventas en curso".');
    },

    onEliminar: o ? async () => {
      const { error } = await db.from('oportunidades').delete().eq('id', o.id);
      if (error) return errorDB(error);
      cargarVentas();
    } : null,
    confirmarEliminar: '¿Eliminar esta venta del tablero?',
  });

  const form = $('form-general');

  // El motivo de pérdida solo aparece si la etapa es "Perdido"
  const selectEtapa = form.querySelector('select[name=etapa]');
  const actualizarMotivo = () => $('campo-motivo').classList.toggle('oculto', selectEtapa.value !== 'perdido');
  selectEtapa.addEventListener('change', actualizarMotivo);
  actualizarMotivo();

  // Interesado / cliente existente
  if (!fijo) {
    const actualizarQuien = () => {
      const q = form.querySelector('input[name=quien]:checked').value;
      form.querySelectorAll('[data-quien]').forEach((el) => el.classList.toggle('oculto', el.dataset.quien !== q));
      form.querySelector('[name=prospecto_nombre]').required = q === 'interesado';
      form.querySelector('[name=cliente]').required = q === 'cliente';
    };
    form.querySelectorAll('input[name=quien]').forEach((r) => r.addEventListener('change', actualizarQuien));
    actualizarQuien();
    form.querySelector('[name=prospecto_nombre]').focus();
  }
}

  { id: 'administrativo', nombre: 'administrativo',           plural: 'Administrativos' },
  { id: 'ejecutivo',      nombre: 'ejecutivo de cuenta',      plural: 'Ejecutivos de cuenta' },
  { id: 'perito',         nombre: 'perito',                   plural: 'Peritos' },

];
let fichaCompania = null; // { compania, contactos }

async function verCompania(id) {
  seccionActual = 'ficha-compania';
  marcarMenu('companias');
  window.scrollTo(0, 0);
  $('contenido').innerHTML = '<div class="vacio">Cargando...</div>';

  const [rc, rk] = await Promise.all([
    db.from('companias').select('*').eq('id', id).single(),

  return (lista || [])

    .join(' · ');
}

function htmlContacto(k, conRol = false) {

}

const TIPOS_SINIESTRO = {
  choque: 'Choque / colisión', robo_total: 'Robo total', robo_parcial: 'Robo parcial',
  granizo: 'Granizo', incendio: 'Incendio', cristales: 'Rotura de cristales',
  danos_agua: 'Daños por agua', rc: 'Responsabilidad civil', lesiones: 'Lesiones', otro: 'Otro',
};
const ESTADOS_SINIESTRO = [
  { id: 'denunciado',    nombre: 'Denunciado',            color: 'violeta' },
  { id: 'en_tramite',    nombre: 'En trámite',            color: 'azul' },
  { id: 'inspeccion',    nombre: 'Inspección / peritaje', color: 'azul' },
  { id: 'documentacion', nombre: 'Falta documentación',   color: 'amarillo' },
  { id: 'reparacion',    nombre: 'En reparación',         color: 'azul' },
  { id: 'liquidado',     nombre: 'Liquidado / pagado',    color: 'verde' },
  { id: 'cerrado',       nombre: 'Cerrado',               color: 'gris' },
  { id: 'rechazado',     nombre: 'Rechazado',             color: 'rojo' },
];
const ESTADOS_CERRADOS = ['liquidado', 'cerrado', 'rechazado'];
const nombreEstadoSiniestro = (id) => ESTADOS_SINIESTRO.find((e) => e.id === id)?.nombre || id;
function chipSiniestro(estado) {
  const e = ESTADOS_SINIESTRO.find((x) => x.id === estado) || { nombre: estado, color: 'gris' };
  return `<span class="chip ${e.color}">${e.nombre}</span>`;
}
const diasEntre = (desdeISO, hastaISO) => Math.round((aFecha(hastaISO) - aFecha(desdeISO)) / 86400000);

const filtroSin = { texto: '', estado: 'abiertos', compania: '' };
let numeroBusquedaSin = 0;
let temporizadorSin = null;
let ultimosSiniestros = [];
let gestoresListado = {}; // id de contacto -> contacto (tramitadores del listado)

function dibujarSiniestros() {
  $('contenido').innerHTML = `
    <div class="cabecera-seccion">

        <p class="bajada">Seguimiento de cada siniestro, con su próxima acción agendada</p>

  $('sin-texto').addEventListener('input', (e) => {

  });
  $('sin-estado').addEventListener('change', (e) => { filtroSin.estado = e.target.value; buscarSiniestros(); });
  $('sin-compania').addEventListener('change', (e) => { filtroSin.compania = e.target.value; buscarSiniestros(); });

  buscarSiniestros();
}

async function buscarSiniestros() {
  const miBusqueda = ++numeroBusquedaSin;
  const texto = filtroSin.texto.replace(/[,()*%\\]/g, ' ').trim();

  let q = db.from('siniestros')
    .select('*, clientes(nombre_mostrar, telefono, dni_cuit), companias(nombre), polizas(numero_poliza, patente, bien_asegurado)')
    .order('fecha_siniestro', { ascending: false })
    .limit(500);
  if (filtroSin.estado === 'abiertos') q = q.not('estado', 'in', `(${ESTADOS_CERRADOS.join(',')})`);
  else if (filtroSin.estado) q = q.eq('estado', filtroSin.estado);
  if (filtroSin.compania) q = q.eq('compania_id', filtroSin.compania);

  if (texto) {
    let porNombre = db.from('clientes').select('id').limit(100);
    texto.split(/\s+/).forEach((p) => { porNombre = porNombre.ilike('nombre_mostrar', `%${p}%`); });
    const { data: cli } = await porNombre;
    const condiciones = [
      `numero_siniestro.ilike.%${texto}%`,
      `tercero_nombre.ilike.%${texto}%`,
      `tercero_patente.ilike.%${texto.replace(/[\s-]/g, '')}%`,
    ];
    const ids = (cli || []).map((c) => c.id);
    if (ids.length) condiciones.push(`cliente_id.in.(${ids.join(',')})`);
    q = q.or(condiciones.join(','));
  }

  const { data, error } = await q;
  if (miBusqueda !== numeroBusquedaSin) return;
  const caja = $('lista-siniestros');
  if (!caja) return;

  if (error) {
    const falta = /siniestros/.test(error.message || '') && /find|exist/i.test(error.message || '');
    caja.innerHTML = `<div class="vacio"><div class="mensaje-error">${falta
      ? 'Falta correr en Supabase el archivo "crm_siniestros_usuarios.sql".'
      : escapar(errorDB(error))}</div></div>`;
    return;
  }

  // Tramitadores y próximas acciones agendadas
  const ids = data.map((s) => s.id);
  const idsGestores = [...new Set(data.map((s) => s.tramitador_id).filter(Boolean))];
  const [rAcc, rGes] = await Promise.all([
    ids.length
      ? db.from('agenda').select('siniestro_id, fecha, hora, titulo').eq('completado', false).in('siniestro_id', ids)
        .order('fecha', { ascending: true }).order('hora', { ascending: true, nullsFirst: true })
      : { data: [] },
    idsGestores.length ? db.from('compania_contactos').select('*').in('id', idsGestores) : { data: [] },
  ]);
  if (miBusqueda !== numeroBusquedaSin || !$('lista-siniestros')) return;

  const proxima = {};
  (rAcc.data || []).forEach((a) => { if (!proxima[a.siniestro_id]) proxima[a.siniestro_id] = a; });
  gestoresListado = {};
  (rGes.data || []).forEach((k) => { gestoresListado[k.id] = k; });
  data.forEach((s) => { s._proxima = proxima[s.id]; });
  ultimosSiniestros = data;

  if (data.length === 0) {
    caja.innerHTML = vacio('🚨', filtroSin.estado === 'abiertos' && !texto && !filtroSin.compania
      ? 'No hay siniestros abiertos. 🎉'
      : 'No hay siniestros que coincidan con estos filtros.');
    return;
  }

  const hoy = hoyISO();
  const filas = data.map((s) => {
    const abierto = !ESTADOS_CERRADOS.includes(s.estado);
    const dias = diasEntre(s.fecha_denuncia || s.fecha_siniestro, hoy);
    const acc = s._proxima;
    let accion = '-';
    if (acc) {
      const atrasada = acc.fecha < hoy;
      accion = `<span class="${atrasada ? 'alerta-roja' : ''}">${acc.fecha === hoy ? 'Hoy' : formatearFecha(acc.fecha)}${acc.hora ? ' ' + horaCorta(acc.hora) : ''}</span>`;
    } else if (abierto) {
      accion = '<span class="alerta-roja">⚠️ Sin agendar</span>';
    }
    return `
      <tr class="fila-click" data-accion="ver-siniestro" data-id="${s.id}">
        <td>${chipSiniestro(s.estado)}</td>
        <td>${formatearFecha(s.fecha_siniestro)}</td>
        <td><strong>${escapar(s.clientes?.nombre_mostrar)}</strong></td>
        <td>${escapar(s.companias?.nombre) || '-'}</td>
        <td>${TIPOS_SINIESTRO[s.tipo] || s.tipo}</td>
        <td>${escapar(s.numero_siniestro) || '-'}</td>
        <td>${escapar(gestoresListado[s.tramitador_id]?.nombre) || '-'}</td>
        <td>${accion}</td>
        <td>${abierto ? `${dias} día${dias === 1 ? '' : 's'}` : '-'}</td>
      </tr>`;
  }).join('');

  caja.innerHTML = `
    <div class="tabla-contenedor"><table>
      <thead><tr><th>Estado</th><th>Fecha</th><th>Cliente</th><th>Compañía</th><th>Tipo</th><th>N° siniestro</th><th>Tramitador</th><th>Próxima acción</th><th>Abierto hace</th></tr></thead>
      <tbody>${filas}</tbody>
    </table></div>
    <div class="pie-tabla">${data.length} siniestro${data.length === 1 ? '' : 's'}</div>`;
}

function exportarSiniestros() {
  if (ultimosSiniestros.length === 0) { alert('No hay siniestros para exportar con estos filtros.'); return; }
  descargarCSV('siniestros', [
    { titulo: 'Estado', valor: (s) => nombreEstadoSiniestro(s.estado) },
    { titulo: 'Fecha del siniestro', valor: (s) => formatearFecha(s.fecha_siniestro) },
    { titulo: 'Hora', valor: (s) => horaCorta(s.hora_siniestro) },
    { titulo: 'Fecha de denuncia', valor: (s) => (s.fecha_denuncia ? formatearFecha(s.fecha_denuncia) : '') },
    { titulo: 'Cliente', valor: (s) => s.clientes?.nombre_mostrar },
    { titulo: 'DNI / CUIT', valor: (s) => s.clientes?.dni_cuit, texto: true },
    { titulo: 'Teléfono cliente', valor: (s) => s.clientes?.telefono, texto: true },
    { titulo: 'Compañía', valor: (s) => s.companias?.nombre },
    { titulo: 'N° póliza', valor: (s) => s.polizas?.numero_poliza, texto: true },
    { titulo: 'Bien asegurado', valor: (s) => s.polizas?.patente || s.polizas?.bien_asegurado },
    { titulo: 'N° siniestro', valor: (s) => s.numero_siniestro, texto: true },
    { titulo: 'Tipo', valor: (s) => TIPOS_SINIESTRO[s.tipo] },
    { titulo: 'Lugar', valor: (s) => s.lugar },
    { titulo: 'Lesionados', valor: (s) => (s.hubo_lesionados ? 'Sí' : 'No') },
    { titulo: 'Intervino policía', valor: (s) => (s.intervino_policia ? 'Sí' : 'No') },
    { titulo: 'Tercero', valor: (s) => s.tercero_nombre },
    { titulo: 'Patente tercero', valor: (s) => s.tercero_patente },
    { titulo: 'Aseguradora tercero', valor: (s) => s.tercero_aseguradora },
    { titulo: 'Tramitador', valor: (s) => gestoresListado[s.tramitador_id]?.nombre },
    { titulo: 'Taller', valor: (s) => s.taller },
    { titulo: 'Monto reclamado', valor: (s) => s.monto_reclamado },
    { titulo: 'Monto indemnizado', valor: (s) => s.monto_indemnizado },
    { titulo: 'Próxima acción', valor: (s) => (s._proxima ? `${formatearFecha(s._proxima.fecha)} ${s._proxima.titulo}` : '') },
    { titulo: 'Descripción', valor: (s) => s.descripcion },
  ], ultimosSiniestros);
}

// ---------- Formulario de siniestro (nuevo / editar) ----------
async function abrirFormSiniestro(s = null, clienteFijo = null) {
  const fijo = s ? { id: s.cliente_id, nombre: s.clientes?.nombre_mostrar } : clienteFijo;

  let listaClientes = [];
  if (!fijo) {
    const { data } = await db.from('clientes').select('id, nombre_mostrar, dni_cuit').order('nombre_mostrar').limit(3000);
    listaClientes = data || [];
    if (listaClientes.length === 0) {
      abrirModal({
        titulo: 'Primero cargá el cliente',
        cuerpo: '<div class="aviso-info">El siniestro va asociado a un cliente. Cargalo en <strong>Clientes</strong> y después denunciá el siniestro desde su ficha.</div>',
        onGuardar: async () => { irA('clientes'); },
        textoGuardar: 'Ir a Clientes',
      });
      return;
    }
  }
  const etiquetaCliente = (c) => (c.dni_cuit ? `${c.nombre_mostrar} — ${c.dni_cuit}` : c.nombre_mostrar);

  let polizasCliente = [];
  const hoy = hoyISO();
  const num = (x) => (x === null || x === undefined ? '' : x);

  abrirModal({
    titulo: s ? 'Editar siniestro' : '🚨 Nuevo siniestro',
    ancho: true,
    cuerpo: `
      <div class="campo"><label>Cliente *</label>
        ${fijo
          ? `<input value="${escapar(fijo.nombre)}" disabled>`
          : `<input name="cliente" list="lista-clientes-sin" required placeholder="Empezá a escribir el nombre o DNI..." autocomplete="off">
             <datalist id="lista-clientes-sin">${listaClientes.map((c) => `<option value="${escapar(etiquetaCliente(c))}"></option>`).join('')}</datalist>`}
      </div>
      <div class="fila-2">
        <div class="campo"><label>Póliza afectada</label>
          <select name="poliza_id"><option value="">${fijo ? 'Cargando...' : 'Primero elegí el cliente'}</option></select>
        </div>
        <div class="campo"><label>Compañía</label>
          <select name="compania_id">${opciones(companias.filter((c) => c.activa || c.id === s?.compania_id), s?.compania_id, '-')}</select>
        </div>
      </div>

      <div class="seccion-form">El hecho</div>
      <div class="fila-3">
        <div class="campo"><label>Tipo *</label>
          <select name="tipo" required>
            <option value="">Elegí...</option>
            ${Object.entries(TIPOS_SINIESTRO).map(([k, t]) => `<option value="${k}" ${sel(k, s?.tipo)}>${t}</option>`).join('')}
          </select>
        </div>
        <div class="campo"><label>Fecha del siniestro *</label><input type="date" name="fecha_siniestro" required max="${hoy}" value="${s ? s.fecha_siniestro : hoy}"></div>
        <div class="campo"><label>Hora</label><input type="time" name="hora_siniestro" value="${escapar(horaCorta(s?.hora_siniestro))}"></div>
      </div>
      <div class="fila-3">
        <div class="campo"><label>Fecha de denuncia</label><input type="date" name="fecha_denuncia" value="${s ? escapar(s.fecha_denuncia) : hoy}"></div>
        <div class="campo"><label>N° de siniestro</label><input name="numero_siniestro" value="${escapar(s?.numero_siniestro)}" placeholder="Lo da la compañía"></div>
        <div class="campo"><label>Lugar</label><input name="lugar" value="${escapar(s?.lugar)}" placeholder="Calle y altura, localidad"></div>
      </div>
      <div class="campo"><label>¿Qué pasó?</label><textarea name="descripcion" rows="3" placeholder="Relato breve de cómo ocurrió">${escapar(s?.descripcion)}</textarea></div>
      <div class="fila-checks">
        <label class="check-linea"><input type="checkbox" name="hubo_lesionados" ${s?.hubo_lesionados ? 'checked' : ''}> Hubo lesionados</label>
        <label class="check-linea"><input type="checkbox" name="intervino_policia" ${s?.intervino_policia ? 'checked' : ''}> Intervino la policía</label>
      </div>

      <div class="seccion-form">Tercero involucrado (si hubo)</div>
      <div class="fila-3">
        <div class="campo"><label>Nombre</label><input name="tercero_nombre" value="${escapar(s?.tercero_nombre)}"></div>
        <div class="campo"><label>Teléfono</label><input name="tercero_telefono" type="tel" value="${escapar(s?.tercero_telefono)}"></div>
        <div class="campo"><label>Patente</label><input name="tercero_patente" style="text-transform:uppercase" value="${escapar(s?.tercero_patente)}"></div>
      </div>
      <div class="fila-2">
        <div class="campo"><label>Su aseguradora</label><input name="tercero_aseguradora" value="${escapar(s?.tercero_aseguradora)}"></div>
        <div class="campo"><label>Su N° de póliza</label><input name="tercero_poliza" value="${escapar(s?.tercero_poliza)}"></div>
      </div>

      <div class="seccion-form">Gestión</div>
      <div class="fila-3">
        <div class="campo"><label>Estado</label>
          <select name="estado">${ESTADOS_SINIESTRO.map((e) => `<option value="${e.id}" ${sel(e.id, s?.estado || 'denunciado')}>${e.nombre}</option>`).join('')}</select>
        </div>
        <div class="campo"><label>Tramitador</label><select name="tramitador_id"><option value="">-</option></select></div>
        <div class="campo"><label>Perito</label><select name="perito_id"><option value="">-</option></select></div>
      </div>
      <div class="fila-3">
        <div class="campo"><label>Taller</label><input name="taller" value="${escapar(s?.taller)}"></div>
        <div class="campo"><label>Fecha de inspección</label><input type="date" name="fecha_inspeccion" value="${escapar(s?.fecha_inspeccion)}"></div>
        <div class="campo"><label>Monto reclamado ($)</label><input type="number" min="0" step="1" name="monto_reclamado" value="${num(s?.monto_reclamado)}"></div>
      </div>
      <div class="fila-2">
        <div class="campo"><label>Monto indemnizado ($)</label><input type="number" min="0" step="1" name="monto_indemnizado" value="${num(s?.monto_indemnizado)}"></div>
        <div class="campo"><label>Notas internas</label><input name="notas" value="${escapar(s?.notas)}"></div>
      </div>

      ${s ? '' : `
      <div class="seccion-form">📒 Primer seguimiento (queda en la agenda)</div>
      <label class="check-linea"><input type="checkbox" name="agendar" checked> Agendar seguimiento</label>
      <div class="fila-3" id="bloque-agendar">
        <div class="campo"><label>Día</label><input type="date" name="agenda_fecha" value="${sumarDias(hoy, 2)}"></div>
        <div class="campo"><label>Hora</label><input type="time" name="agenda_hora"></div>
        <div class="campo"><label>¿Para quién?</label><select name="agenda_para">${Object.entries(perfiles).map(([id, n]) => `<option value="${id}" ${sel(id, usuarioId)}>${escapar(n)}${id === usuarioId ? ' (yo)' : ''}</option>`).join('')}</select></div>
      </div>
      <div class="campo"><label>¿Qué hay que hacer?</label><input name="agenda_titulo" value="Pedir N° de siniestro y seguir el trámite"></div>`}`,

    onGuardar: async (d) => {
      let clienteId = fijo?.id;
      if (!clienteId) {
        const elegido = listaClientes.find((c) => etiquetaCliente(c) === (d.cliente || '').trim());
        if (!elegido) return 'Elegí el cliente de la lista que aparece al escribir.';
        clienteId = elegido.id;
      }
      if (!d.tipo) return 'Elegí el tipo de siniestro.';
      if (!d.fecha_siniestro) return 'Falta la fecha del siniestro.';

      const patenteTercero = v(d, 'tercero_patente');
      const datos = {
        cliente_id: clienteId,
        poliza_id: d.poliza_id || null,
        compania_id: d.compania_id ? Number(d.compania_id) : null,
        tipo: d.tipo,
        fecha_siniestro: d.fecha_siniestro,
        hora_siniestro: d.hora_siniestro || null,
        fecha_denuncia: v(d, 'fecha_denuncia'),
        numero_siniestro: v(d, 'numero_siniestro'),
        lugar: v(d, 'lugar'),
        descripcion: v(d, 'descripcion'),
        hubo_lesionados: d.hubo_lesionados === 'on',
        intervino_policia: d.intervino_policia === 'on',
        tercero_nombre: v(d, 'tercero_nombre'),
        tercero_telefono: v(d, 'tercero_telefono'),
        tercero_patente: patenteTercero ? patenteTercero.toUpperCase().replace(/[\s-]/g, '') : null,
        tercero_aseguradora: v(d, 'tercero_aseguradora'),
        tercero_poliza: v(d, 'tercero_poliza'),
        estado: d.estado,
        tramitador_id: d.tramitador_id || null,
        perito_id: d.perito_id || null,
        taller: v(d, 'taller'),
        fecha_inspeccion: v(d, 'fecha_inspeccion'),
        monto_reclamado: d.monto_reclamado ? Number(d.monto_reclamado) : null,
        monto_indemnizado: d.monto_indemnizado ? Number(d.monto_indemnizado) : null,
        notas: v(d, 'notas'),
      };

      const { data: guardado, error } = s
        ? await db.from('siniestros').update(datos).eq('id', s.id).select().single()
        : await db.from('siniestros').insert(datos).select().single();
      if (error) return errorDB(error);

      // Registro automático en la libreta de novedades
      if (!s) {
        await db.from('siniestro_novedades').insert({ siniestro_id: guardado.id, detalle: `Siniestro cargado (${nombreEstadoSiniestro(datos.estado)}).` });
      } else if (s.estado !== datos.estado) {
        await db.from('siniestro_novedades').insert({
          siniestro_id: s.id,
          detalle: `Cambio de estado: ${nombreEstadoSiniestro(s.estado)} → ${nombreEstadoSiniestro(datos.estado)}`,
        });
      }

      // Primer seguimiento en la agenda
      if (!s && d.agendar === 'on' && d.agenda_fecha) {
        const cliente = fijo?.nombre || listaClientes.find((c) => c.id === clienteId)?.nombre_mostrar || '';
        await db.from('agenda').insert({
          fecha: d.agenda_fecha,
          hora: d.agenda_hora || null,
          titulo: `${v(d, 'agenda_titulo') || 'Seguimiento siniestro'} — ${cliente}`,
          notas: `Siniestro: ${TIPOS_SINIESTRO[datos.tipo]}${datos.numero_siniestro ? ' N° ' + datos.numero_siniestro : ''}`,
          para: d.agenda_para || usuarioId,
          cliente_id: clienteId,
          siniestro_id: guardado.id,
        });
        actualizarAlertaDia();
      }

      verSiniestro(guardado.id);
    },

    onEliminar: s ? async () => {
      const { error } = await db.from('siniestros').delete().eq('id', s.id);
      if (error) return errorDB(error);
      irA('siniestros');
    } : null,
    confirmarEliminar: '¿Eliminar este siniestro y toda su libreta de novedades? Esto no se puede deshacer.',
  });

  // ----- Partes que cambian según lo que se elige -----
  const form = $('form-general');
  const selPoliza = form.querySelector('[name=poliza_id]');
  const selCompania = form.querySelector('[name=compania_id]');
  const selTramitador = form.querySelector('[name=tramitador_id]');
  const selPerito = form.querySelector('[name=perito_id]');

  async function cargarPolizasDe(clienteId, elegida) {
    selPoliza.innerHTML = '<option value="">Cargando...</option>';
    const { data } = await db.from('polizas').select('*').eq('cliente_id', clienteId)
      .order('estado', { ascending: false }).order('fecha_vencimiento', { ascending: false });
    polizasCliente = data || [];
    const nombreDe = (lista, id) => lista.find((x) => x.id === id)?.nombre || '';
    selPoliza.innerHTML = `<option value="">${polizasCliente.length ? 'Sin póliza / no está cargada' : 'El cliente no tiene pólizas cargadas'}</option>` +
      polizasCliente.map((p) => `<option value="${p.id}" ${sel(p.id, elegida)}>${escapar(
        [nombreDe(companias, p.compania_id), nombreDe(ramos, p.ramo_id), p.numero_poliza ? 'N° ' + p.numero_poliza : '', p.patente || p.bien_asegurado]
          .filter(Boolean).join(' · ')
      )}${p.estado !== 'vigente' ? ` (${ESTADOS_POLIZA[p.estado].toLowerCase()})` : ''}</option>`).join('');
  }

  async function cargarGestores(companiaId) {
    const elegidoT = selTramitador.value || s?.tramitador_id || '';
    const elegidoP = selPerito.value || s?.perito_id || '';
    if (!companiaId) {
      selTramitador.innerHTML = '<option value="">Elegí la compañía</option>';
      selPerito.innerHTML = '<option value="">Elegí la compañía</option>';
      return;
    }
    const { data } = await db.from('compania_contactos').select('id, nombre, rol')
      .eq('compania_id', companiaId).in('rol', ['tramitador', 'perito']).order('nombre');
    const lista = data || [];
    const armar = (rol, elegido, textoVacio) => {
      const deRol = lista.filter((k) => k.rol === rol);
      return `<option value="">${deRol.length ? '-' : textoVacio}</option>` +
        deRol.map((k) => `<option value="${k.id}" ${sel(k.id, elegido)}>${escapar(k.nombre)}</option>`).join('');
    };
    selTramitador.innerHTML = armar('tramitador', elegidoT, 'No hay cargados en la compañía');
    selPerito.innerHTML = armar('perito', elegidoP, 'No hay cargados en la compañía');
  }

  selPoliza.addEventListener('change', () => {
    const p = polizasCliente.find((x) => x.id === selPoliza.value);
    if (p) {
      selCompania.value = p.compania_id;
      cargarGestores(p.compania_id);
    }
  });
  selCompania.addEventListener('change', () => cargarGestores(selCompania.value));

  if (fijo) {
    cargarPolizasDe(fijo.id, s?.poliza_id);
  } else {
    const inputCliente = form.querySelector('[name=cliente]');
    inputCliente.addEventListener('change', () => {
      const elegido = listaClientes.find((c) => etiquetaCliente(c) === inputCliente.value.trim());
      if (elegido) cargarPolizasDe(elegido.id);
    });
  }
  cargarGestores(selCompania.value);

  const checkAgendar = form.querySelector('[name=agendar]');
  if (checkAgendar) {
    checkAgendar.addEventListener('change', () => $('bloque-agendar').classList.toggle('oculto', !checkAgendar.checked));
  }
}

// ---------- Ficha del siniestro ----------
let fichaSiniestro = null; // { siniestro, novedades, acciones, gestores }

async function verSiniestro(id) {
  seccionActual = 'ficha-siniestro';
  marcarMenu('siniestros');
  window.scrollTo(0, 0);
  $('contenido').innerHTML = '<div class="vacio">Cargando...</div>';

  const [rs, rn, ra] = await Promise.all([
    db.from('siniestros').select('*, clientes(id, nombre_mostrar, telefono, email), companias(nombre, telefono, email), polizas(numero_poliza, patente, bien_asegurado, ramo_id, fecha_vencimiento, estado)').eq('id', id).single(),
    db.from('siniestro_novedades').select('*').eq('siniestro_id', id).order('fecha', { ascending: false }),
    db.from('agenda').select('*').eq('siniestro_id', id).order('fecha', { ascending: true }).order('hora', { ascending: true, nullsFirst: true }),
  ]);
  if (seccionActual !== 'ficha-siniestro') return;
  if (rs.error) {
    $('contenido').innerHTML = `
      <button class="volver" data-accion="volver-siniestros">← Volver a siniestros</button>
      <div class="mensaje-error">No se pudo abrir el siniestro: ${escapar(errorDB(rs.error))}</div>`;
    return;
  }

  const s = rs.data;
  const idsGestores = [s.tramitador_id, s.perito_id].filter(Boolean);
  const { data: gestores } = idsGestores.length
    ? await db.from('compania_contactos').select('*').in('id', idsGestores)
    : { data: [] };
  if (seccionActual !== 'ficha-siniestro') return;

  fichaSiniestro = { siniestro: s, novedades: rn.data || [], acciones: ra.data || [], gestores: gestores || [] };
  dibujarFichaSiniestro();
}

function dibujarFichaSiniestro() {
  const { siniestro: s, novedades, acciones, gestores } = fichaSiniestro;
  const hoy = hoyISO();
  const abierto = !ESTADOS_CERRADOS.includes(s.estado);
  const dato = (etiqueta, valorHTML) => (valorHTML ? `<dt>${etiqueta}</dt><dd>${valorHTML}</dd>` : '');
  const tramitador = gestores.find((k) => k.id === s.tramitador_id);
  const perito = gestores.find((k) => k.id === s.perito_id);
  const contactoHTML = (k) => (k ? `<strong>${escapar(k.nombre)}</strong>
    ${k.telefonos?.length ? `<br>📞 ${htmlTelefonos(k.telefonos)}` : ''}
    ${k.email ? `<br>✉️ <a href="mailto:${escapar(k.email)}">${escapar(k.email)}</a>` : ''}` : '');

  const hecho = [
    dato('Fecha y hora', `${formatearFecha(s.fecha_siniestro)}${s.hora_siniestro ? ' · ' + horaCorta(s.hora_siniestro) + ' h' : ''}`),
    dato('Denunciado el', s.fecha_denuncia ? formatearFecha(s.fecha_denuncia) : ''),
    dato('Lugar', escapar(s.lugar)),
    dato('Lesionados / policía', `${s.hubo_lesionados ? '<span class="alerta-roja">Hubo lesionados</span>' : 'Sin lesionados'} · ${s.intervino_policia ? 'Intervino la policía' : 'Sin intervención policial'}`),
    dato('¿Qué pasó?', escapar(s.descripcion)),
  ].join('');

  const poliza = s.polizas ? [
    dato('Compañía', escapar(s.companias?.nombre)),
    dato('Tipo de seguro', escapar(ramos.find((r) => r.id === s.polizas.ramo_id)?.nombre)),
    dato('N° de póliza', escapar(s.polizas.numero_poliza)),
    dato('Bien asegurado', escapar([s.polizas.patente, s.polizas.bien_asegurado].filter(Boolean).join(' · '))),
    dato('Vencimiento', `${formatearFecha(s.polizas.fecha_vencimiento)} (${ESTADOS_POLIZA[s.polizas.estado].toLowerCase()})`),
  ].join('') : dato('Compañía', escapar(s.companias?.nombre)) + '<p class="bajada" style="margin:10px 0 0">Sin póliza asociada.</p>';

  const tercero = [
    dato('Nombre', escapar(s.tercero_nombre)),
    dato('Teléfono', s.tercero_telefono ? htmlTelefonos([s.tercero_telefono]) : ''),
    dato('Patente', escapar(s.tercero_patente)),
    dato('Aseguradora', escapar(s.tercero_aseguradora)),
    dato('Su póliza', escapar(s.tercero_poliza)),
  ].join('');

  const gestion = [
    dato('Tramitador', contactoHTML(tramitador)),
    dato('Perito', contactoHTML(perito)),
    dato('Taller', escapar(s.taller)),
    dato('Inspección', s.fecha_inspeccion ? formatearFecha(s.fecha_inspeccion) : ''),
    dato('Monto reclamado', s.monto_reclamado ? formatoPlata.format(s.monto_reclamado) : ''),
    dato('Monto indemnizado', s.monto_indemnizado ? formatoPlata.format(s.monto_indemnizado) : ''),
    dato('Notas internas', escapar(s.notas)),
  ].join('');

  const accionesHTML = acciones.map((a) => {
    const atrasada = !a.completado && a.fecha < hoy;
    return `
      <div class="accion-item ${a.completado ? 'hecha' : ''}">
        <input type="checkbox" data-accion="check-accion-sin" data-id="${a.id}" ${a.completado ? 'checked' : ''} aria-label="Marcar como hecha">
        <div style="flex:1; min-width:0">
          <div class="accion-fecha ${atrasada ? 'atrasada' : ''}">${a.fecha === hoy ? 'Hoy' : formatearFecha(a.fecha)}${a.hora ? ' · ' + horaCorta(a.hora) : ''}${perfiles[a.para] ? ' · ' + escapar(perfiles[a.para]) : ''}${atrasada ? ' · atrasada' : ''}</div>
          <div class="accion-texto">${escapar(a.titulo)}</div>
        </div>
      </div>`;
  }).join('');
  const pendientes = acciones.filter((a) => !a.completado).length;

  const novedadesHTML = novedades.map((n) => `
    <div class="historial-item">
      <div class="historial-icono">📝</div>
      <div style="flex:1; min-width:0">
        <div class="historial-meta">${fechaHora(n.fecha)}${perfiles[n.created_by] ? ' · ' + escapar(perfiles[n.created_by]) : ''}</div>
        <div class="historial-detalle">${escapar(n.detalle)}</div>
      </div>

function generarClave() {
  const letras = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const azar = crypto.getRandomValues(new Uint32Array(10));
  return Array.from(azar, (n) => letras[n % letras.length]).join('');
}

// =====================================================================
//  GRÁFICO DE TORTA (dibujado a mano, sin librerías)
// =====================================================================
const COLORES_TORTA = ['#2c5282', '#16a34a', '#f59e0b', '#7c3aed', '#0891b2', '#db2777',
  '#65a30d', '#ea580c', '#4f46e5', '#0d9488', '#b45309', '#64748b'];

// datos: [{ nombre, valor, color? }]
function graficoTorta(titulo, subtitulo, datos) {
  let lista = datos.filter((d) => d.valor > 0).sort((a, b) => b.valor - a.valor);
  // Más de 8 porciones: se agrupan las chicas en "Otras"
  if (lista.length > 8) {
    const resto = lista.slice(7).reduce((s, d) => s + d.valor, 0);
    lista = [...lista.slice(0, 7), { nombre: 'Otras', valor: resto, color: '#94a3b8' }];
  }
  const total = lista.reduce((s, d) => s + d.valor, 0);
  lista.forEach((d, i) => { d.color = d.color || COLORES_TORTA[i % COLORES_TORTA.length]; });

  let cuerpo;
  if (!total) {
    cuerpo = '<div class="contactos-vacio" style="padding:40px 0; text-align:center">Sin datos para mostrar</div>';
  } else {
    const cx = 80, cy = 80, R = 74, r = 44;
    const punto = (rad, a) => `${(cx + rad * Math.cos(a)).toFixed(2)} ${(cy + rad * Math.sin(a)).toFixed(2)}`;
    let angulo = -Math.PI / 2;
    const porciones = lista.map((d) => {
      const fraccion = d.valor / total;
      if (fraccion > 0.9999) {
        return `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="${d.color}" stroke-width="${R - r}"><title>${escapar(d.nombre)}: ${d.valor}</title></circle>`;
      }
      const fin = angulo + fraccion * 2 * Math.PI;
      const grande = fraccion > 0.5 ? 1 : 0;
      const camino = `M ${punto(R, angulo)} A ${R} ${R} 0 ${grande} 1 ${punto(R, fin)} L ${punto(r, fin)} A ${r} ${r} 0 ${grande} 0 ${punto(r, angulo)} Z`;
      angulo = fin;
      return `<path d="${camino}" fill="${d.color}" stroke="#fff" stroke-width="1.5"><title>${escapar(d.nombre)}: ${d.valor}</title></path>`;
    }).join('');

    const leyenda = lista.map((d) => `
      <li><span class="punto" style="background:${d.color}"></span>${escapar(d.nombre)}
        <span class="cant">${d.valor}</span><span class="pct">${Math.round((d.valor / total) * 100)}%</span></li>`).join('');

    cuerpo = `
      <div class="torta-cuerpo">
        <svg width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="${escapar(titulo)}">
          ${porciones}
          <text x="80" y="80" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">${total}</text>
          <text x="80" y="98" text-anchor="middle" font-size="11" fill="#6b7280">total</text>
        </svg>
        <ul class="leyenda">${leyenda}</ul>
      </div>`;
  }
  return `<div class="grafico"><div class="grafico-titulo">${titulo}</div><div class="grafico-sub">${subtitulo}</div>${cuerpo}</div>`;
}

function agrupar(lista, clave, nombrePara) {
  const cuenta = {};
  lista.forEach((x) => {
    const k = clave(x);
    cuenta[k] = (cuenta[k] || 0) + 1;
  });
  return Object.entries(cuenta).map(([k, valor]) => ({ nombre: nombrePara(k), valor }));
}

  'este-mes': () => [primerDiaDelMes(), hoyISO()],
  'mes-anterior': () => { const f = new Date(); return [aISO(new Date(f.getFullYear(), f.getMonth() - 1, 1)), aISO(new Date(f.getFullYear(), f.getMonth(), 0))]; },

};

async function confirmarCargaInicial() {
  if (!confirm('¿Confirmás que terminaste de cargar tu cartera?\n\nDesde ahora, cada póliza nueva que cargues cuenta como producción (alta).')) return;
  const { error } = await db.from('perfiles').update({ carga_inicial_at: new Date().toISOString() }).eq('id', usuarioId);
  if (error) { alert('No se pudo confirmar: ' + errorDB(error)); return; }
  dibujarEstadisticas();
}

async function calcularEstadisticas() {
  const caja = $('resultado-estadisticas');
  if (!caja) return;
  if (!est.desde || !est.hasta || est.desde > est.hasta) {
    caja.innerHTML = '<div class="mensaje-error">Revisá el período: la fecha "desde" tiene que ser anterior a "hasta".</div>';
    return;
  }

  // ¿La cartera elegida ya confirmó su carga inicial?
  const elegido = est.cartera === 'mia' || est.cartera === 'todas' ? null : perfilesLista.find((p) => p.id === est.cartera);
  const avisoSinConfirmar = elegido && !elegido.carga_inicial_at
    ? `<div class="aviso-info">${escapar(elegido.nombre || elegido.email)} todavía no confirmó su carga inicial: por ahora no tiene altas de producción.</div>`
    : '';

  caja.innerHTML = '<div class="vacio">Calculando...</div>';
  const pedido = { desde: est.desde, hasta: est.hasta, cartera: est.cartera };
  let data;
  try {
    // Se traen TODAS las pólizas (Supabase las entrega de a 1000)
    data = await traerTodos(() => filtrarCartera(
      db.from('polizas').select('id, cliente_id, compania_id, ramo_id, estado, origen, fecha_alta, fecha_baja, fecha_renovacion, motivo_baja').order('id'),
      pedido.cartera,
    ));
  } catch (error) {
    if ($('resultado-estadisticas')) caja.innerHTML = `<div class="mensaje-error">${escapar(errorDB(error))}</div>`;
    return;
  }
  // Si mientras calculaba se cambió el período, no mostrar este resultado viejo
  if (!$('resultado-estadisticas') || pedido.desde !== est.desde || pedido.hasta !== est.hasta || pedido.cartera !== est.cartera) return;

  const enPeriodo = (f) => f && f >= est.desde && f <= est.hasta;
  // Cartera al cierre del período: pólizas que ya estaban cargadas y que todavía
  // no se habían dado de baja ni renovado en esa fecha
  const vigenteEl = (p, fecha) => {
    if (!p.fecha_alta || p.fecha_alta > fecha) return false;
    if (p.estado === 'anulada') return false;
    if (p.fecha_baja && p.fecha_baja <= fecha) return false;
    if (p.estado === 'renovada' && (!p.fecha_renovacion || p.fecha_renovacion <= fecha)) return false;
    return true;
  };
  const vigentes = data.filter((p) => vigenteEl(p, est.hasta));
  const clientesVigentes = new Set(vigentes.map((p) => p.cliente_id)).size;
  const cierre = formatearFecha(est.hasta);
  const altas = data.filter((p) => p.origen === 'nueva' && enPeriodo(p.fecha_alta));
  const bajas = data.filter((p) => p.estado === 'baja' && enPeriodo(p.fecha_baja));
  const neto = altas.length - bajas.length;

  const nombreCompania = (id) => companias.find((c) => String(c.id) === String(id))?.nombre || 'Sin compañía';
  const nombreRamo = (id) => ramos.find((r) => String(r.id) === String(id))?.nombre || 'Sin tipo de seguro';
  const periodoTexto = `del ${formatearFecha(est.desde)} al ${formatearFecha(est.hasta)}`;

  if (!vigentes.length && !altas.length && !bajas.length) {
    caja.innerHTML = `
      ${avisoSinConfirmar}
      <div class="confirmar-carga" style="max-width:none">
        <h2>📭 Sin datos en este período</h2>
        <p>Entre el ${formatearFecha(est.desde)} y el ${cierre} no había pólizas cargadas en el sistema, ni altas ni bajas.</p>
        <p class="texto-paso">Recordá que la cartera cuenta desde el día en que cada póliza se cargó en el CRM.</p>
      </div>`;
    return;
  }

  caja.innerHTML = `
    ${avisoSinConfirmar}
    <div class="kpis">
      <div class="kpi total"><div class="numero">${vigentes.length}</div><div class="etiqueta">📄 Pólizas vigentes al ${cierre}</div></div>
      <div class="kpi total"><div class="numero">${clientesVigentes}</div><div class="etiqueta">👥 Clientes con pólizas vigentes al ${cierre}</div></div>
      <div class="kpi altas"><div class="numero">${altas.length}</div><div class="etiqueta">⬆️ Altas en el período</div></div>
      <div class="kpi bajas"><div class="numero">${bajas.length}</div><div class="etiqueta">⬇️ Bajas en el período</div></div>
      <div class="kpi neto"><div class="numero ${neto > 0 ? 'neto-positivo' : neto < 0 ? 'neto-negativo' : ''}">${neto > 0 ? '+' : ''}${neto}</div><div class="etiqueta">⚖️ Producción neta (altas − bajas)</div></div>
    </div>
    <div class="graficos">
      ${graficoTorta('Cartera por compañía', `Pólizas vigentes al ${cierre}`, agrupar(vigentes, (p) => p.compania_id, nombreCompania))}
      ${graficoTorta('Cartera por tipo de seguro', `Pólizas vigentes al ${cierre}`, agrupar(vigentes, (p) => p.ramo_id, nombreRamo))}
      ${graficoTorta('Altas vs. bajas', periodoTexto, [
        { nombre: 'Altas', valor: altas.length, color: '#16a34a' },
        { nombre: 'Bajas', valor: bajas.length, color: '#dc2626' },
      ])}
      ${graficoTorta('Altas por compañía', periodoTexto + ' · sin contar renovaciones', agrupar(altas, (p) => p.compania_id, nombreCompania))}
      ${graficoTorta('Altas por tipo de seguro', periodoTexto, agrupar(altas, (p) => p.ramo_id, nombreRamo))}
      ${graficoTorta('Bajas por compañía', periodoTexto, agrupar(bajas, (p) => p.compania_id, nombreCompania))}
      ${graficoTorta('Bajas por motivo', periodoTexto, agrupar(bajas, (p) => (p.motivo_baja || 'Sin motivo').split(' — ')[0], (k) => k))}
    </div>
    <p class="pie-tabla">Cartera = pólizas que ya estaban cargadas en el CRM y seguían vigentes el último día del período. Alta = póliza cargada en el período después de confirmar la carga inicial (las renovaciones y las importadas no cuentan). Baja = póliza dada de baja con fecha dentro del período.</p>`;
}

async function cargarBajas() {
  const esClientes = filtroBajas.pestana === 'clientes';
  let q = esClientes
    ? db.from('clientes').select('*').eq('activo', false)
    : db.from('polizas').select('*, clientes(nombre_mostrar, telefono, email), companias(nombre), ramos(nombre)').eq('estado', 'baja');
  q = q.order('fecha_baja', { ascending: false }).limit(1000);
  if (filtroBajas.desde) q = q.gte('fecha_baja', filtroBajas.desde);
  if (filtroBajas.hasta) q = q.lte('fecha_baja', filtroBajas.hasta);
  if (filtroBajas.motivo) q = q.ilike('motivo_baja', `${filtroBajas.motivo}%`);
  q = filtrarCartera(q, filtroBajas.cartera);

  const { data, error } = await q;
  const caja = $('lista-bajas');
  if (!caja) return;
  if (error) {
    caja.innerHTML = `<div class="vacio"><div class="mensaje-error">${/activo|fecha_baja|column/i.test(error.message || '')
      ? 'Falta correr en Supabase el archivo "crm_privacidad_bajas_estadisticas.sql".'
      : escapar(errorDB(error))}</div></div>`;
    return;
  }
  ultimasBajas = data;
  if (data.length === 0) {
    caja.innerHTML = vacio('🗂️', esClientes ? 'No hay clientes dados de baja con estos filtros.' : 'No hay pólizas dadas de baja con estos filtros.');
    return;
  }

  const botones = (clienteId, nombre, reactivar) => `
    <td style="white-space:nowrap">
      <button class="btn-secundario" data-accion="ofrecer-baja" data-id="${clienteId}" data-nombre="${escapar(nombre)}">💼 Ofrecer algo</button>
      ${reactivar}
    </td>`;

  const filas = esClientes
    ? data.map((c) => `
      <tr class="fila-click" data-accion="ver-cliente" data-id="${c.id}">
        <td><strong>${escapar(c.nombre_mostrar)}</strong></td>
        <td>${escapar(c.dni_cuit) || '-'}</td>
        <td>${escapar(c.telefono) || '-'}</td>
        <td>${formatearFecha(c.fecha_baja)}</td>
        <td>${escapar(c.motivo_baja) || '-'}</td>
        ${botones(c.id, c.nombre_mostrar, `<button class="btn-secundario" data-accion="reactivar-cliente-baja" data-id="${c.id}">↩️ Reactivar</button>
          <button class="btn-peligro" data-accion="eliminar-cliente-definitivo" data-id="${c.id}" title="Eliminar definitivamente">🗑️</button>`)}
      </tr>`).join('')
    : data.map((p) => `
      <tr class="fila-click" data-accion="ver-cliente" data-id="${p.cliente_id}">
        <td><strong>${escapar(p.clientes?.nombre_mostrar)}</strong></td>
        <td>${escapar(p.companias?.nombre)}</td>
        <td>${escapar(p.ramos?.nombre)}</td>
        <td>${escapar(p.numero_poliza) || '-'}</td>
        <td>${escapar(descripcionBien(p)) || '-'}</td>
        <td>${formatearFecha(p.fecha_baja)}</td>
        <td>${escapar(p.motivo_baja) || '-'}</td>
        ${botones(p.cliente_id, p.clientes?.nombre_mostrar || '', `<button class="btn-secundario" data-accion="reactivar-poliza-baja" data-id="${p.id}">↩️ Reactivar</button>`)}
      </tr>`).join('');

  const encabezado = esClientes
    ? '<th>Cliente</th><th>DNI / CUIT</th><th>Teléfono</th><th>Fecha de baja</th><th>Motivo</th><th></th>'
    : '<th>Cliente</th><th>Compañía</th><th>Tipo de seguro</th><th>N° póliza</th><th>Bien asegurado</th><th>Fecha de baja</th><th>Motivo</th><th></th>';

  caja.innerHTML = `
    <div class="tabla-contenedor"><table><thead><tr>${encabezado}</tr></thead><tbody>${filas}</tbody></table></div>
    <div class="pie-tabla">${data.length} ${esClientes ? 'cliente' : 'póliza'}${data.length === 1 ? '' : 's'}</div>`;
}

  if (filtroBajas.pestana === 'clientes') {
    descargarCSV('bajas_clientes', [
      { titulo: 'Cliente', valor: (c) => c.nombre_mostrar },
      { titulo: 'DNI / CUIT', valor: (c) => c.dni_cuit, texto: true },

$('contenido').addEventListener('click', async (e) => {
  const el = e.target.closest('[data-accion]');
  if (!el) return;
  const id = el.dataset.id;

  switch (el.dataset.accion) {
    case 'baja-cliente':      abrirBajaCliente(); break;
    case 'reactivar-cliente': reactivarCliente(fichaActual.cliente.id, () => verCliente(fichaActual.cliente.id)); break;

    case 'confirmar-carga':   confirmarCargaInicial(); break;
    case 'est-atajo': {
      [est.desde, est.hasta] = ATAJOS_PERIODO[el.dataset.atajo]();
      $('est-desde').value = est.desde;
      $('est-hasta').value = est.hasta;
      calcularEstadisticas();
      break;
    }

    case 'pestana-bajas':     filtroBajas.pestana = el.dataset.pestana; dibujarBajas(); break;
    case 'exportar-bajas':    exportarBajas(); break;
    case 'ofrecer-baja':      abrirFormVenta(null, { id, nombre: el.dataset.nombre }); break;
    case 'reactivar-cliente-baja': reactivarCliente(id, cargarBajas); break;
    case 'reactivar-poliza-baja':  reactivarPoliza({ id }, cargarBajas); break;

    case 'toggle-supervision': {
      const { error } = await db.rpc('cambiar_supervision', { usuario: id, valor: el.checked });
      if (error) { alert('No se pudo cambiar: ' + errorDB(error)); el.checked = !el.checked; return; }
      await cargarPerfiles();
      break;
    }
  }
});

let promesaXLSX = null;
function cargarXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!promesaXLSX) {
    promesaXLSX = new Promise((ok, mal) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = () => ok(window.XLSX);
      s.onerror = () => {
        promesaXLSX = null;
        mal(new Error('No se pudo cargar la herramienta de Excel. Revisá tu conexión a internet.'));
      };
      document.head.appendChild(s);
    });
  }
  return promesaXLSX;
}

// Trae TODAS las filas de una consulta (Supabase las entrega de a 1000)
async function traerTodos(armarConsulta) {
  const todos = [];
  for (let desde = 0; ; desde += 1000) {
    const { data, error } = await armarConsulta().range(desde, desde + 999);
    if (error) throw error;
    todos.push(...data);
    if (data.length < 1000) return todos;
  }
}

  } catch { return null; }

async function hacerCopiaSeguridad() {
  const boton = $('btn-copia');
  boton.disabled = true;
  boton.textContent = '💾 Preparando...';
  try {
    const XLSX = await cargarXLSX();
    const datos = {};
    for (const t of TABLAS_COPIA) {
      try {
        datos[t.tabla] = await traerTodos(() => db.from(t.tabla).select('*').order('id'));
      } catch { datos[t.tabla] = null; } // por si alguna tabla todavía no existe
    }

    const nombreCliente = {};
    (datos.clientes || []).forEach((c) => { nombreCliente[c.id] = c.nombre_mostrar; });
    const nombreDe = (lista, id) => lista.find((x) => String(x.id) === String(id))?.nombre || '';

    // Columnas legibles primero (nombres en vez de códigos), después todo lo demás
    const legible = (fila) => {
      const out = {};
      if ('cliente_id' in fila) out['Cliente'] = nombreCliente[fila.cliente_id] || '';
      if ('compania_id' in fila && !('nombre' in fila && 'activa' in fila)) out['Compañía (nombre)'] = nombreDe(companias, fila.compania_id);
      if ('ramo_id' in fila) out['Tipo de seguro (nombre)'] = nombreDe(ramos, fila.ramo_id);
      if ('para' in fila) out['Para'] = perfiles[fila.para] || '';
      if ('usuario_id' in fila) out['Cartera de'] = perfiles[fila.usuario_id] || '';
      Object.entries(fila).forEach(([k, val]) => {
        out[k] = Array.isArray(val) ? val.join(' / ') : (val === null ? '' : val);
      });
      return out;
    };

    const libro = XLSX.utils.book_new();
    const resumen = [
      ['Copia de seguridad — CRM Seguros'],
      ['Fecha', fechaHora(new Date().toISOString())],
      ['Usuario', $('usuario-email').textContent],
      [],
      ['Hoja', 'Cantidad de registros'],
      ...TABLAS_COPIA.map((t) => [t.hoja, datos[t.tabla] === null ? 'no disponible' : datos[t.tabla].length]),
    ];
    XLSX.utils.book_append_sheet(libro, XLSX.utils.aoa_to_sheet(resumen), 'Resumen');
    TABLAS_COPIA.forEach((t) => {
      const filas = (datos[t.tabla] || []).map(legible);
      const hoja = filas.length ? XLSX.utils.json_to_sheet(filas) : XLSX.utils.aoa_to_sheet([['(sin datos)']]);
      XLSX.utils.book_append_sheet(libro, hoja, t.hoja);
    });
    XLSX.writeFile(libro, `copia_seguridad_crm_${hoyISO()}.xlsx`);

    try { localStorage.setItem('crm_ultima_copia', hoyISO()); } catch { /* sin almacenamiento */ }
    boton.textContent = '✅ Copia descargada';
    setTimeout(() => { boton.textContent = '💾 Copia de seguridad'; }, 4000);
    if (seccionActual === 'inicio') dibujarInicio();
  } catch (e) {
    boton.textContent = '💾 Copia de seguridad';
    alert('No se pudo hacer la copia: ' + (e.message || e));
  } finally {
    boton.disabled = false;
  }
}

$('btn-copia').addEventListener('click', hacerCopiaSeguridad);

// Año del vehículo: acepta 2019, "2019", "Mod. 2019", 19 → 2019
function parseAnio(valor) {
  const t = String(valor ?? '').trim();
  if (!t) return null;
  const cuatro = t.match(/\b(19|20)\d{2}\b/);
  if (cuatro) return Number(cuatro[0]);
  const soloNumeros = t.replace(/\D/g, '');
  if (soloNumeros.length === 2) {
    const n = Number(soloNumeros);
    return n <= (new Date().getFullYear() % 100) + 1 ? 2000 + n : 1900 + n;
  }
  return null;
}

// ---------- Interpretar valores ----------
function parseFecha(valor) {
  if (valor === null || valor === undefined || valor === '') return null;
  if (typeof valor === 'number') {
    if (valor < 60 || valor > 80000 || !window.XLSX) return null; // número de fecha de Excel
    const f = XLSX.SSF.parse_date_code(valor);
    return f ? `${f.y}-${pad(f.m)}-${pad(f.d)}` : null;
  }
  if (valor instanceof Date) return isNaN(valor) ? null : aISO(valor);
  const t = String(valor).trim();
  let a, m, d;
  let x = t.match(/^(\d{1,2})[/\-.](\d{1,2})[/\-.](\d{2,4})/);
  if (x) { [d, m, a] = [Number(x[1]), Number(x[2]), Number(x[3])]; }
  else if ((x = t.match(/^(\d{4})[/\-.](\d{1,2})[/\-.](\d{1,2})/))) { [a, m, d] = [Number(x[1]), Number(x[2]), Number(x[3])]; }
  else return null;
  if (a < 100) a += a < 50 ? 2000 : 1900;
  if (m < 1 || m > 12 || d < 1 || d > 31) return null;
  const fecha = new Date(a, m - 1, d);
  return fecha.getMonth() === m - 1 ? aISO(fecha) : null;
}

const SINONIMOS_RAMO = [
  ['casa', 'Hogar'], ['departamento', 'Hogar'], ['bicicleta', 'Bicicletas'], ['drones', 'Drones'],
  ['celulares', 'Celular'], ['telefono', 'Celular'], ['notebooks', 'Notebook'], ['laptop', 'Notebook'],
  ['hogar', 'Hogar'], ['combinado familiar', 'Hogar'], ['vivienda', 'Hogar'],
  ['comercio', 'Integral de comercio'], ['integral', 'Integral de comercio'],
  ['moto', 'Motos'], ['auto', 'Autos'], ['automotor', 'Autos'], ['vehiculo', 'Autos'],
  ['accidentes', 'Accidentes personales'], ['ap', 'Accidentes personales'], ['vida', 'Vida'],
  ['art', 'ART'], ['riesgos del trabajo', 'ART'], ['caucion', 'Caución'], ['bici', 'Bicicletas'],
  ['notebook', 'Notebook'], ['celular', 'Celular'], ['consorcio', 'Consorcio'], ['dron', 'Drones'],
];
function buscarRamo(texto) {
  const n = normalizar(texto);
  if (!n) return null;
  const exacto = ramos.find((r) => normalizar(r.nombre) === n);
  if (exacto) return exacto.id;
  for (const [sin, nombre] of SINONIMOS_RAMO) {
    if (new RegExp(`\\b${sin}${sin.length <= 3 ? '\\b' : ''}`).test(n)) {
      const r = ramos.find((x) => x.nombre === nombre);
      if (r) return r.id;
    }
  }
  return null;
}
function buscarCompania(texto) {
  const n = normalizar(texto);
  if (!n) return null;
  const exacta = companias.find((c) => normalizar(c.nombre) === n);
  if (exacta) return exacta.id;
  const parecida = companias.find((c) => {
    const nc = normalizar(c.nombre);
    return nc.startsWith(n + ' ') || n.startsWith(nc + ' ');
  });
  return parecida ? parecida.id : null;
}
function mapPago(texto) {
  const n = normalizar(texto);
  if (!n) return null;
  if (/tarjet|credito|visa|master|amex|naranja|cabal/.test(n)) return 'tarjeta_credito';
  if (/cbu|debito|debit|banc/.test(n)) return 'cbu';
  if (/cupon|efectivo|pago facil|rapipago|contado/.test(n)) return 'cupon';
  return null;
}
function mapEstadoCivil(texto) {
  const n = normalizar(texto);
  if (/solter/.test(n)) return 'soltero';
  if (/casad/.test(n)) return 'casado';
  if (/divorc|separad/.test(n)) return 'divorciado';
  if (/viud/.test(n)) return 'viudo';
  if (/concub|union|convivi/.test(n)) return 'union_convivencial';
  return null;
}
function mapProvincia(texto) {
  const n = normalizar(texto);
  if (!n) return null;
  if (/capital federal|caba|ciudad autonoma/.test(n)) return 'CABA';
  if (/^(bs as|pcia bs as|buenos aires|pcia de buenos aires|provincia de buenos aires)$/.test(n)) return 'Buenos Aires';
  if (n === 'cba') return 'Córdoba';
  const p = PROVINCIAS.find((x) => normalizar(x) === n);
  return p || String(texto).trim();
}

async function leerArchivo(archivo) {
  $('imp-mapeo').innerHTML = '<div class="vacio">Leyendo el archivo...</div>';
  $('imp-resultado').innerHTML = '';
  try {
    const XLSX = await cargarXLSX();
    const buffer = await archivo.arrayBuffer();
    imp.libro = XLSX.read(buffer, { type: 'array' });
    imp.archivo = archivo.name;
    prepararHoja(imp.libro.SheetNames[0]);
  } catch (e) {
    imp.libro = null;
    $('imp-mapeo').innerHTML = `<div class="mensaje-error">No se pudo leer el archivo: ${escapar(e.message || e)}</div>`;
  }
}

function prepararHoja(nombreHoja) {
  imp.hoja = nombreHoja;
  imp.analisis = null;
  const filas = XLSX.utils.sheet_to_json(imp.libro.Sheets[nombreHoja], { header: 1, raw: true, defval: '' });
  // La fila de títulos es la primera que tiene al menos 2 celdas con algo
  const idx = filas.findIndex((f) => f.filter((c) => String(c).trim() !== '').length >= 2);
  imp.filaEncabezado = idx < 0 ? 0 : idx;
  imp.encabezados = (filas[imp.filaEncabezado] || []).map((c) => String(c).trim());
  imp.datos = filas.slice(imp.filaEncabezado + 1).filter((f) => f.some((c) => String(c).trim() !== ''));
  adivinarMapa();
  dibujarMapeo();
}

function adivinarMapa() {
  imp.mapa = {};
  const usadas = new Set();
  const normEnc = imp.encabezados.map(normalizar);
  const junto = (x) => x.replace(/ /g, ''); // "d n i" (de "D.N.I.") se compara como "dni"
  // 1° vuelta: títulos iguales  ·  2° vuelta: títulos que contienen la palabra
  [(h, s) => h === s || junto(h) === junto(s),
   (h, s) => s.length >= 4 && (h.startsWith(s + ' ') || h.endsWith(' ' + s) || h.includes(' ' + s + ' '))]
    .forEach((coincide) => {
      CAMPOS_IMP.forEach((campo) => {
        if (imp.mapa[campo.id] !== undefined) return;
        for (const sin of campo.sin) {
          const col = normEnc.findIndex((h, i) => !usadas.has(i) && h && coincide(h, sin));
          if (col >= 0) { imp.mapa[campo.id] = String(col); usadas.add(col); break; }
        }
      });
    });
  // Si hay Nombre y también Apellido, no hace falta "nombre completo"
}

function valorEjemplo(campoId) {
  const col = imp.mapa[campoId];
  if (col === undefined || col === '') return '';
  const fila = imp.datos.find((f) => String(f[col] ?? '').trim() !== '');
  if (!fila) return '';
  const v = fila[col];
  if (CAMPOS_FECHA.includes(campoId)) {
    const iso = parseFecha(v);
    return iso ? formatearFecha(iso) : `⚠️ "${v}" (no la entiendo como fecha)`;
  }
  return String(v);
}

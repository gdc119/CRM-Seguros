async function analizarImportacion() {
  const caja = $('imp-resultado');
  const tiene = (id) => imp.mapa[id] !== undefined && imp.mapa[id] !== '';
  if (!['nombre_completo', 'nombre', 'apellido', 'razon_social'].some(tiene)) {
    caja.innerHTML = '<div class="mensaje-error" style="margin-top:16px">Elegí al menos la columna del nombre del cliente (nombre, apellido, nombre completo o razón social).</div>';
    return;
  }
  const hayPolizas = ['compania', 'fecha_vencimiento'].some(tiene);
  if (hayPolizas && !(tiene('compania') && tiene('fecha_vencimiento'))) {
    caja.innerHTML = '<div class="mensaje-error" style="margin-top:16px">Para importar pólizas hacen falta, como mínimo, las columnas de <strong>Compañía</strong> y <strong>Vencimiento</strong>.</div>';
    return;
  }
  caja.innerHTML = '<div class="vacio">Revisando el archivo...</div>';

  const crearCias = $('imp-crear-cias').checked;
  const clientes = new Map();
  const errores = [];
  const avisos = [];
  const ciasNuevas = new Map(); // nombre normalizado -> nombre a crear
  let totalPolizas = 0;

  imp.datos.forEach((fila, i) => {
    const n = imp.filaEncabezado + i + 2; // número de fila como en Excel
    const crudo = (campo) => (tiene(campo) ? fila[imp.mapa[campo]] : '');
    const t = (campo) => String(crudo(campo) ?? '').trim();

    const nombreCompleto = t('nombre_completo');
    const nombre = t('nombre');
    const apellido = t('apellido');
    const razon = t('razon_social');
    const dni = t('dni_cuit').replace(/\D/g, '') || null;

    if (!nombreCompleto && !nombre && !apellido && !razon) {
      errores.push(`Fila ${n}: no tiene nombre, se saltea.`);
      return;
    }

    let datos;
    const cuitEmpresa = dni && dni.length === 11 && /^3[034]/.test(dni);
    const nombreEmpresa = /\b(srl|s r l|sa|s a|sas|sh|sociedad|cooperativa|coop)$/.test(normalizar(nombreCompleto));
    const pareceEmpresa = razon || (!nombre && !apellido && (cuitEmpresa || nombreEmpresa));
    if (pareceEmpresa) {
      datos = { tipo: 'empresa', razon_social: razon || nombreCompleto, nombre: null, apellido: null };
    } else if (nombre) {
      datos = { tipo: 'persona', nombre, apellido: apellido || null };
    } else {
      datos = { tipo: 'persona', nombre: nombreCompleto || apellido, apellido: null };
    }
    const nombreMostrar = datos.tipo === 'empresa'
      ? datos.razon_social
      : `${datos.apellido || ''} ${datos.nombre || ''}`.trim();

    Object.assign(datos, {
      dni_cuit: dni,
      telefono: t('telefono') || null,
      email: t('email') || null,
      direccion: t('direccion') || null,
      localidad: t('localidad') || null,
      provincia: mapProvincia(t('provincia')),
      fecha_nacimiento: datos.tipo === 'persona' ? parseFecha(crudo('fecha_nacimiento')) : null,
      estado_civil: datos.tipo === 'persona' ? mapEstadoCivil(t('estado_civil')) : null,
      profesion: datos.tipo === 'persona' ? (t('profesion') || null) : null,
      vencimiento_carnet: datos.tipo === 'persona' ? parseFecha(crudo('vencimiento_carnet')) : null,
      notas: t('notas') || null,
    });
    if (tiene('vencimiento_carnet') && t('vencimiento_carnet') && datos.tipo === 'persona' && !datos.vencimiento_carnet) {
      avisos.push(`Fila ${n}: el vencimiento del carnet "${t('vencimiento_carnet')}" no es una fecha válida, se deja vacío.`);
    }

    const clave = dni ? `D:${dni}` : `N:${normalizar(nombreMostrar)}`;
    if (!clientes.has(clave)) {
      clientes.set(clave, { clave, nombreMostrar, datos, polizas: [], fila: n });
    } else {
      // Mismo cliente en otra fila: se completan los datos que falten
      const existente = clientes.get(clave).datos;
      Object.entries(datos).forEach(([k, val]) => { if (val && !existente[k]) existente[k] = val; });
    }
    const cliente = clientes.get(clave);

    // Póliza de esta fila
    if (!hayPolizas) return;
    const hayAlgo = ['compania', 'numero_poliza', 'fecha_vencimiento', 'patente', 'bien_asegurado', 'ramo',
      'marca', 'version', 'anio', 'cobertura'].some((c) => t(c));
    if (!hayAlgo) return;
    const estadoTexto = normalizar(t('estado_poliza'));
    if (/baja|anulad|renovad|cancelad/.test(estadoTexto)) {
      avisos.push(`Fila ${n}: la póliza figura como "${t('estado_poliza')}", no se importa (el cliente sí).`);
      return;
    }
    const textoCia = t('compania');
    const venc = parseFecha(crudo('fecha_vencimiento'));
    if (!textoCia) { errores.push(`Fila ${n}: la póliza no tiene compañía. Se importa solo el cliente.`); return; }
    if (!venc) { errores.push(`Fila ${n}: el vencimiento "${t('fecha_vencimiento')}" no es una fecha válida. Se importa solo el cliente.`); return; }

    let companiaId = buscarCompania(textoCia);
    if (!companiaId) {
      if (!crearCias) { errores.push(`Fila ${n}: la compañía "${textoCia}" no está cargada. Se importa solo el cliente.`); return; }
      if (!ciasNuevas.has(normalizar(textoCia))) ciasNuevas.set(normalizar(textoCia), textoCia);
    }
    let cobertura = t('cobertura') || null;
    let ramoId = buscarRamo(t('ramo'));
    // Si no hay columna de tipo de seguro, la cobertura puede traerlo (ej: "Hogar")
    if (!ramoId && !t('ramo') && cobertura) {
      const posible = buscarRamo(cobertura);
      if (posible) {
        ramoId = posible;
        if (normalizar(ramos.find((r) => r.id === posible)?.nombre) === normalizar(cobertura)) cobertura = null;
      }
    }
    const hayVehiculo = ['patente', 'marca', 'version', 'anio'].some((c) => t(c));
    if (!ramoId && hayVehiculo) {
      const esMoto = /moto/.test(normalizar(`${t('ramo')} ${t('cobertura')} ${t('version')}`));
      ramoId = ramos.find((r) => r.nombre === (esMoto ? 'Motos' : 'Autos'))?.id || null;
    }
    if (!ramoId) {
      if (t('ramo')) avisos.push(`Fila ${n}: no reconocí el tipo de seguro "${t('ramo')}", se carga como "Otros".`);
      ramoId = ramos.find((r) => r.nombre === 'Otros')?.id || ramos[0]?.id;
    }
    const anio = parseAnio(crudo('anio'));
    if (t('anio') && !anio) avisos.push(`Fila ${n}: no entendí el año "${t('anio')}", se deja vacío.`);
    let inicio = parseFecha(crudo('fecha_inicio'));
    if (inicio && inicio > venc) {
      avisos.push(`Fila ${n}: el inicio de vigencia es posterior al vencimiento, se deja vacío.`);
      inicio = null;
    }
    const patente = t('patente').toUpperCase().replace(/[\s-]/g, '') || null;
    cliente.polizas.push({
      textoCia,
      compania_id: companiaId,
      ramo_id: ramoId,
      numero_poliza: t('numero_poliza') || null,
      patente,
      bien_asegurado: t('bien_asegurado') || null,
      vehiculo_marca: t('marca') || null,
      vehiculo_version: t('version') || null,
      vehiculo_anio: anio,
      cobertura,
      fecha_inicio: inicio,
      fecha_vencimiento: venc,
      forma_pago: mapPago(t('forma_pago')),
    });
    totalPolizas++;
  });

  // ¿Cuáles ya están en mi cartera?
  let existentes = new Map();
  try {
    const mios = await traerTodos(() => db.from('clientes').select('id, dni_cuit, nombre_mostrar').eq('usuario_id', usuarioId).order('id'));
    mios.forEach((c) => {
      existentes.set(c.dni_cuit ? `D:${c.dni_cuit}` : `N:${normalizar(c.nombre_mostrar)}`, c.id);
      if (c.dni_cuit) existentes.set(`N:${normalizar(c.nombre_mostrar)}#dni`, c.id);
    });
  } catch (e) {
    caja.innerHTML = `<div class="mensaje-error" style="margin-top:16px">${escapar(errorDB(e))}</div>`;
    return;
  }

  const lista = [...clientes.values()];
  const yaEstan = lista.filter((c) => existentes.has(c.clave)).length;
  imp.analisis = { lista, existentes, ciasNuevas, errores, avisos, totalPolizas };

  const muestra = lista.slice(0, 10).map((c) => `
    <tr>
      <td><strong>${escapar(c.nombreMostrar)}</strong> ${c.datos.tipo === 'empresa' ? '<span class="chip azul">Empresa</span>' : ''}</td>
      <td>${escapar(c.datos.dni_cuit) || '-'}</td>
      <td>${escapar(c.datos.telefono) || '-'}</td>
      <td>${escapar(c.datos.localidad) || '-'}</td>
      <td>${c.polizas.map((p) => escapar([p.textoCia, descripcionBien(p), p.cobertura, `vence ${formatearFecha(p.fecha_vencimiento)}`].filter(Boolean).join(' · '))).join('<br>') || '-'}</td>
      <td>${existentes.has(c.clave) ? '<span class="chip gris">Ya estaba</span>' : '<span class="chip verde">Nuevo</span>'}</td>
    </tr>`).join('');

  const listaProblemas = (titulo, items, clase) => (items.length ? `
    <details class="problemas ${clase}" ${clase === 'error' ? 'open' : ''}>
      <summary>${titulo} (${items.length})</summary>
      <ul>${items.slice(0, 100).map((x) => `<li>${escapar(x)}</li>`).join('')}${items.length > 100 ? `<li>…y ${items.length - 100} más</li>` : ''}</ul>
    </details>` : '');

  caja.innerHTML = `
    <div class="panel" style="margin-top:20px">
      <div class="panel-titulo">4. Revisá el resumen y confirmá</div>
      <div class="kpis" style="padding:16px 18px 0">
        <div class="kpi altas"><div class="numero">${lista.length - yaEstan}</div><div class="etiqueta">👤 Clientes nuevos</div></div>
        <div class="kpi"><div class="numero">${yaEstan}</div><div class="etiqueta">Clientes que ya estaban</div></div>
        <div class="kpi total"><div class="numero">${totalPolizas}</div><div class="etiqueta">📄 Pólizas en el archivo</div></div>
        <div class="kpi neto"><div class="numero">${ciasNuevas.size}</div><div class="etiqueta">🏢 Compañías nuevas a crear</div></div>
      </div>
      <div style="padding:0 18px">
        ${ciasNuevas.size ? `<p class="texto-paso">Se van a crear: <strong>${[...ciasNuevas.values()].map(escapar).join(', ')}</strong></p>` : ''}
        ${listaProblemas('⚠️ Filas con problemas', errores, 'error')}
        ${listaProblemas('ℹ️ Avisos', avisos, 'aviso')}
      </div>
      <div class="panel-titulo" style="border-top:1px solid var(--borde); margin-top:14px">Primeros ${Math.min(10, lista.length)} clientes, así van a quedar</div>
      <div class="tabla-contenedor"><table>
        <thead><tr><th>Cliente</th><th>DNI / CUIT</th><th>Teléfono</th><th>Localidad</th><th>Pólizas</th><th></th></tr></thead>
        <tbody>${muestra}</tbody>
      </table></div>
      <div class="opciones-import">
        <p class="texto-paso">Las pólizas importadas <strong>no cuentan como altas</strong> en las estadísticas (son cartera que ya tenías). Si una póliza ya estaba cargada (mismo cliente, compañía y número), no se duplica.</p>
        <button class="btn-principal" data-accion="imp-confirmar" ${lista.length ? '' : 'disabled'}>✅ Importar ahora</button>
        <div id="imp-progreso"></div>
      </div>
    </div>`;
  caja.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ---------- Importar de verdad ----------
async function confirmarImportacion() {
  const a = imp.analisis;
  if (!a) return;
  const boton = document.querySelector('[data-accion=imp-confirmar]');
  boton.disabled = true;
  const progreso = (texto, pct) => {
    $('imp-progreso').innerHTML = `
      <div class="barra-progreso"><div style="width:${Math.round(pct)}%"></div></div>
      <p class="texto-paso">${texto}</p>`;
  };
  const modo = $('imp-existentes').value;
  const resultado = { nuevos: 0, actualizados: 0, polizas: 0, polizasRepetidas: 0 };
  const LOTE = 300;

  try {
    // 1. Compañías nuevas
    const idCia = {};
    if (a.ciasNuevas.size) {
      progreso('Creando compañías...', 3);
      const { data, error } = await db.from('companias')
        .insert([...a.ciasNuevas.values()].map((nombre) => ({ nombre }))).select('id, nombre');
      if (error) throw error;
      data.forEach((c) => { idCia[normalizar(c.nombre)] = c.id; });
      await cargarCatalogos();
    }

    // 2. Clientes nuevos (de a lotes)
    const idPorClave = new Map(a.existentes);
    const nuevos = a.lista.filter((c) => !a.existentes.has(c.clave));
    for (let i = 0; i < nuevos.length; i += LOTE) {
      const lote = nuevos.slice(i, i + LOTE);
      progreso(`Cargando clientes... ${Math.min(i + LOTE, nuevos.length)} de ${nuevos.length}`, 5 + 45 * (i / Math.max(nuevos.length, 1)));
      const { data, error } = await db.from('clientes').insert(lote.map((c) => c.datos)).select('id, dni_cuit, nombre_mostrar');
      if (error) throw error;
      data.forEach((c) => idPorClave.set(c.dni_cuit ? `D:${c.dni_cuit}` : `N:${normalizar(c.nombre_mostrar)}`, c.id));
      resultado.nuevos += data.length;
    }

    // 3. Clientes que ya estaban: completar datos (si se eligió)
    if (modo === 'actualizar') {
      const yaEstaban = a.lista.filter((c) => a.existentes.has(c.clave));
      for (let i = 0; i < yaEstaban.length; i++) {
        if (i % 10 === 0) progreso(`Actualizando clientes que ya estaban... ${i + 1} de ${yaEstaban.length}`, 50 + 10 * (i / yaEstaban.length));
        const c = yaEstaban[i];
        const cambios = {};
        Object.entries(c.datos).forEach(([k, val]) => { if (val !== null && val !== '' && k !== 'tipo') cambios[k] = val; });
        const { error } = await db.from('clientes').update(cambios).eq('id', a.existentes.get(c.clave));
        if (!error) resultado.actualizados++;
      }
    }

    // 4. Pólizas (sin repetir las que ya estaban)
    progreso('Revisando pólizas que ya estaban cargadas...', 62);
    const existentesPol = await traerTodos(() => db.from('polizas')
      .select('cliente_id, compania_id, ramo_id, numero_poliza, patente, fecha_vencimiento').order('id'));
    const clavePoliza = (p) => (p.numero_poliza
      ? `${p.cliente_id}|${p.compania_id}|N:${normalizar(p.numero_poliza)}`
      : `${p.cliente_id}|${p.compania_id}|${p.ramo_id}|${p.patente || ''}|${p.fecha_vencimiento}`);
    const vistas = new Set(existentesPol.map(clavePoliza));

    const aCargar = [];
    a.lista.forEach((c) => {
      const clienteId = idPorClave.get(c.clave);
      if (!clienteId) return;
      c.polizas.forEach((p) => {
        const fila = {
          cliente_id: clienteId,
          compania_id: p.compania_id || idCia[normalizar(p.textoCia)] || buscarCompania(p.textoCia),
          ramo_id: p.ramo_id,
          numero_poliza: p.numero_poliza,
          patente: p.patente,
          bien_asegurado: p.bien_asegurado,
          vehiculo_marca: p.vehiculo_marca,
          vehiculo_version: p.vehiculo_version,
          vehiculo_anio: p.vehiculo_anio,
          cobertura: p.cobertura,
          fecha_inicio: p.fecha_inicio,
          fecha_vencimiento: p.fecha_vencimiento,
          forma_pago: p.forma_pago,
          origen: 'importada',
        };
        if (!fila.compania_id) return;
        const k = clavePoliza(fila);
        if (vistas.has(k)) { resultado.polizasRepetidas++; return; }
        vistas.add(k);
        aCargar.push(fila);
      });
    });

    for (let i = 0; i < aCargar.length; i += LOTE) {
      progreso(`Cargando pólizas... ${Math.min(i + LOTE, aCargar.length)} de ${aCargar.length}`, 65 + 33 * (i / Math.max(aCargar.length, 1)));
      const { error } = await db.from('polizas').insert(aCargar.slice(i, i + LOTE));
      if (error) {
        if (error.code === '23514' && /origen/.test(error.message || '')) {
          throw new Error('Falta correr en Supabase el archivo "crm_importacion.sql".');
        }
        if (/vehiculo_|cobertura|vencimiento_carnet/.test(error.message || '')) {
          throw new Error('Falta correr en Supabase el archivo "crm_vehiculos_carnet_web.sql".');
        }
        throw error;
      }
      resultado.polizas += Math.min(LOTE, aCargar.length - i);
    }

    progreso('¡Listo!', 100);
    imp.analisis = null;
    $('imp-resultado').innerHTML = `
      <div class="confirmar-carga" style="margin-top:20px; max-width:none">
        <h2>✅ Importación terminada</h2>
        <div class="cifras">
          <div><strong>${resultado.nuevos}</strong>clientes nuevos</div>
          ${modo === 'actualizar' ? `<div><strong>${resultado.actualizados}</strong>clientes actualizados</div>` : ''}
          <div><strong>${resultado.polizas}</strong>pólizas cargadas</div>
          ${resultado.polizasRepetidas ? `<div><strong>${resultado.polizasRepetidas}</strong>pólizas que ya estaban (no se duplicaron)</div>` : ''}
        </div>
        <button class="btn-principal" data-accion="volver-clientes">Ver mis clientes</button>
      </div>`;
  } catch (e) {
    boton.disabled = false;
    $('imp-progreso').innerHTML = `<div class="mensaje-error">Se cortó la importación: ${escapar(e.message ? (e.code ? errorDB(e) : e.message) : e)}<br>
      Lo que ya se cargó quedó guardado. Si volvés a importar el mismo archivo, los clientes y pólizas que ya entraron no se duplican.</div>`;
  }
}

// =====================================================================
//  ELIMINAR UN CLIENTE DEFINITIVAMENTE (con todos sus datos)
// =====================================================================
async function eliminarClienteDefinitivo(clienteId) {
  // Primero se cuenta todo lo que se va a borrar, para mostrarlo
  const contar = (tabla, columna = 'cliente_id') =>
    db.from(tabla).select('id', { count: 'exact', head: true }).eq(columna, clienteId);
  const [rc, rPol, rSin, rVen, rHis, rAge] = await Promise.all([
    db.from('clientes').select('id, nombre_mostrar').eq('id', clienteId).single(),
    contar('polizas'), contar('siniestros'), contar('oportunidades'), contar('contactos'), contar('agenda'),
  ]);
  if (rc.error) { alert('No se pudo abrir el cliente: ' + errorDB(rc.error)); return; }
  const nombre = rc.data.nombre_mostrar;
  const n = (r) => (r.error ? 0 : (r.count || 0));
  const item = (cant, singular, plural) => (cant ? `<li><strong>${cant}</strong> ${cant === 1 ? singular : plural}</li>` : '');

  abrirModal({
    titulo: '🗑️ Eliminar definitivamente',
    cuerpo: `
      <div class="peligro-fuerte">
        ⚠️ <strong>Esto no se puede deshacer.</strong> Se va a borrar a <strong>${escapar(nombre)}</strong> y todo lo suyo:
      </div>
      <ul class="lista-borrar">
        <li>Sus datos personales</li>
        ${item(n(rPol), 'póliza (también las dadas de baja)', 'pólizas (también las dadas de baja)')}
        ${item(n(rSin), 'siniestro con su libreta de novedades', 'siniestros con su libreta de novedades')}
        ${item(n(rVen), 'venta', 'ventas')}
        ${item(n(rHis), 'registro del historial de contactos', 'registros del historial de contactos')}
        ${item(n(rAge), 'anotación de la agenda', 'anotaciones de la agenda')}
      </ul>
      <div class="aviso-info">💡 Si el cliente solo se fue, mejor usá <strong>"⛔ Dar de baja"</strong>: queda guardado en Bajas por si más adelante querés ofrecerle algo. Eliminar es para errores de carga o si el cliente pidió que se borren sus datos.</div>
      <div class="campo"><label>Para confirmar, escribí <strong>ELIMINAR</strong></label>
        <input name="confirmar" autocomplete="off" placeholder="ELIMINAR">
      </div>`,
    textoGuardar: 'Eliminar para siempre',
    onGuardar: async (d) => {
      if ((d.confirmar || '').trim().toUpperCase() !== 'ELIMINAR') return 'Escribí la palabra ELIMINAR para confirmar.';

      // Anotaciones de agenda ligadas al cliente, a sus siniestros o a sus ventas
      const [rs, ro] = await Promise.all([
        db.from('siniestros').select('id').eq('cliente_id', clienteId),
        db.from('oportunidades').select('id').eq('cliente_id', clienteId),
      ]);
      const borrados = [db.from('agenda').delete().eq('cliente_id', clienteId)];
      const idsSin = (rs.data || []).map((x) => x.id);
      const idsVen = (ro.data || []).map((x) => x.id);
      if (idsSin.length) borrados.push(db.from('agenda').delete().in('siniestro_id', idsSin));
      if (idsVen.length) borrados.push(db.from('agenda').delete().in('oportunidad_id', idsVen));
      await Promise.all(borrados);

      // El cliente (sus pólizas, siniestros, ventas e historial se borran con él)
      const { error } = await db.from('clientes').delete().eq('id', clienteId);
      if (error) return 'No se pudo eliminar: ' + errorDB(error);

      actualizarAlertaDia();
      if (seccionActual === 'bajas') cargarBajas();
      else irA('clientes');
      setTimeout(() => alert(`${nombre} fue eliminado definitivamente.`), 50);
    },
  });
  $('modal-guardar').classList.add('rojo');
}

$('contenido').addEventListener('click', (e) => {
  const el = e.target.closest('[data-accion="eliminar-cliente-definitivo"]');
  if (!el) return;
  e.stopPropagation();
  eliminarClienteDefinitivo(el.dataset.id);
});

  switch (el.dataset.accion) {

      const c = fichaCompania.compania;

          <div class="campo"><label>Dirección web</label>

          </div>
          <p class="texto-paso">Dejalo vacío para borrar el link.</p>`,
        onGuardar: async (d) => {
          const texto = (d.web || '').trim();
          if (texto && !urlSegura(texto)) return 'Esa dirección no es válida. Ejemplo: https://www.compania.com.ar';
          const { error } = await db.from('companias').update({ web: texto ? urlSegura(texto) : null }).eq('id', c.id);
          if (error) return errorDB(error);
          await cargarCatalogos();
          verCompania(c.id);
        },
      });
      break;
    }
    case 'ver-carnets':
      if ($('panel-carnets')) $('panel-carnets').scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
  }
});

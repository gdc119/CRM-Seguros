<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM Seguros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --azul: #1e3a5f;
    --azul-claro: #2c5282;
    --fondo: #f4f6f9;
    --blanco: #ffffff;
    --texto: #1f2937;
    --gris: #6b7280;
    --borde: #e5e7eb;
    --rojo: #dc2626;
    --rojo-fondo: #fee2e2;
    --amarillo: #b45309;
    --amarillo-fondo: #fef3c7;
    --verde: #15803d;
    --verde-fondo: #dcfce7;
    --papel: #fffdf5;
    --renglon: #e9dfc4;
    --margen-rojo: #f2b8b8;
    --tinta: #23395d;
    --radio: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    font-size: 15px;
  }
  button { font-family: inherit; cursor: pointer; }
  .oculto { display: none !important; }

  /* ---------- FORMULARIOS ---------- */
  label { display: block; font-weight: 500; font-size: 14px; margin-bottom: 6px; }
  .campo { margin-bottom: 16px; position: relative; }
  input, select, textarea {
    width: 100%; padding: 11px 12px;
    border: 1px solid var(--borde); border-radius: 8px;
    font-family: inherit; font-size: 15px; background: #fff; color: var(--texto);
  }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--azul-claro); border-color: transparent; }
  .btn-principal {
    padding: 12px 18px; border: none; border-radius: 8px;
    background: var(--azul); color: #fff; font-weight: 600; font-size: 15px;
  }
  .btn-principal:hover { background: var(--azul-claro); }
  .btn-principal:disabled { opacity: .6; cursor: wait; }
  .btn-chico { padding: 9px 14px; font-size: 14px; }
  .btn-secundario {
    padding: 9px 14px; border-radius: 8px; font-size: 14px; font-weight: 500;
    background: #fff; border: 1px solid var(--borde); color: var(--texto);
  }
  .btn-secundario:hover { background: var(--fondo); }
  .btn-peligro {
    padding: 9px 14px; border-radius: 8px; font-size: 14px; font-weight: 500;
    background: #fff; border: 1px solid #fecaca; color: var(--rojo);
  }
  .btn-peligro:hover { background: var(--rojo-fondo); }
  .mensaje-error {
    background: var(--rojo-fondo); color: var(--rojo);
    padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px;
  }

  /* ---------- LOGIN ---------- */
  #pantalla-login {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    background: linear-gradient(135deg, var(--azul) 0%, var(--azul-claro) 100%);
  }
  .tarjeta-login {
    background: var(--blanco); width: 100%; max-width: 380px;
    padding: 36px 32px; border-radius: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  .tarjeta-login .btn-principal { width: 100%; margin-top: 6px; }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 20px; color: var(--azul); margin-bottom: 6px;
  }
  .logo-icono {
    width: 38px; height: 38px; border-radius: 9px;
    background: var(--azul); color: #fff;
    display: grid; place-items: center; font-size: 20px;
  }
  .subtitulo { color: var(--gris); margin-bottom: 26px; font-size: 14px; }
  .ver-clave {
    position: absolute; right: 8px; bottom: 7px;
    background: none; border: none; color: var(--gris); font-size: 13px; padding: 4px 6px;
  }

  /* ---------- ESTRUCTURA APP ---------- */
  #pantalla-app { display: flex; min-height: 100vh; }
  .menu-lateral {
    width: 230px; background: var(--azul); color: #fff;
    display: flex; flex-direction: column; padding: 20px 12px; flex-shrink: 0;
  }
  .menu-items { display: flex; flex-direction: column; flex: 1; }
  .menu-lateral .logo { color: #fff; padding: 0 8px 22px; font-size: 18px; }
  .menu-lateral .logo-icono { background: rgba(255,255,255,.15); }
  .item-menu {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 8px;
    color: rgba(255,255,255,.8); background: none; border: none;
    font-size: 15px; text-align: left; width: 100%; margin-bottom: 2px;
  }
  .item-menu:hover { background: rgba(255,255,255,.08); color: #fff; }
  .item-menu.activo { background: rgba(255,255,255,.16); color: #fff; font-weight: 600; }
  .item-menu .emoji { width: 22px; text-align: center; }
  .badge {
    margin-left: auto; background: #ef4444; color: #fff;
    font-size: 12px; font-weight: 700; min-width: 22px; height: 22px;
    border-radius: 999px; display: grid; place-items: center; padding: 0 6px;
  }
  .menu-pie { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid rgba(255,255,255,.15); }
  .usuario-email { font-size: 13px; color: rgba(255,255,255,.7); word-break: break-all; margin-bottom: 10px; }
  .btn-salir {
    width: 100%; padding: 8px; border-radius: 8px;
    background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.2);
  }
  .btn-salir:hover { background: rgba(255,255,255,.2); }

  .zona-principal { flex: 1; padding: 28px 32px; min-width: 0; }
  .titulo-seccion { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .bajada { color: var(--gris); margin-bottom: 24px; }

  /* ---------- ALERTA DEL DÍA ---------- */
  .alerta-dia {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--amarillo-fondo); border: 1px solid #fcd34d;
    border-radius: var(--radio); padding: 14px 16px; margin-bottom: 22px;
  }
  .alerta-icono { font-size: 22px; line-height: 1; }
  .alerta-texto { flex: 1; min-width: 0; }
  .alerta-texto strong { color: #78350f; }
  .alerta-texto ul { list-style: none; margin-top: 6px; }
  .alerta-texto li { font-size: 14px; color: #78350f; padding: 2px 0; }
  .alerta-texto .hora-alerta { font-weight: 600; margin-right: 6px; }
  .atrasadas { color: var(--rojo); font-weight: 600; }
  .alerta-acciones { display: flex; gap: 6px; align-items: center; }
  .alerta-acciones .btn-secundario { padding: 6px 12px; font-size: 13px; white-space: nowrap; }
  .btn-cerrar-alerta {
    background: none; border: none; color: #92400e; font-size: 16px; padding: 4px 8px; border-radius: 6px;
  }
  .btn-cerrar-alerta:hover { background: rgba(0,0,0,.06); }

  /* ---------- INICIO ---------- */
  .resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .caja-resumen {
    background: var(--blanco); border-radius: var(--radio); padding: 18px;
    border-left: 5px solid var(--borde);
  }
  .caja-resumen.rojo { border-left-color: var(--rojo); }
  .caja-resumen.amarillo { border-left-color: #f59e0b; }
  .caja-resumen .numero { font-size: 32px; font-weight: 700; }
  .caja-resumen.rojo .numero { color: var(--rojo); }
  .caja-resumen.amarillo .numero { color: var(--amarillo); }
  .caja-resumen .etiqueta { color: var(--gris); font-size: 14px; }

  .panel { background: var(--blanco); border-radius: var(--radio); overflow: hidden; }
  .panel-titulo { padding: 16px 18px; font-weight: 600; border-bottom: 1px solid var(--borde); }
  .tabla-contenedor { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--borde); white-space: nowrap; }
  th { font-size: 13px; color: var(--gris); font-weight: 500; background: #fafbfc; }
  tr.fila-rojo { background: #fff5f5; }
  .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .chip.rojo { background: var(--rojo-fondo); color: var(--rojo); }
  .chip.amarillo { background: var(--amarillo-fondo); color: var(--amarillo); }
  .chip.verde { background: var(--verde-fondo); color: var(--verde); }

  .vacio { padding: 40px 20px; text-align: center; color: var(--gris); }
  .vacio .emoji-grande { font-size: 36px; margin-bottom: 8px; }
  .proximamente {
    background: var(--blanco); border-radius: var(--radio);
    padding: 60px 20px; text-align: center; color: var(--gris);
  }

  /* ---------- AGENDA ---------- */
  .agenda-cabecera {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px; flex-wrap: wrap; margin-bottom: 4px;
  }
  .agenda-controles { display: flex; gap: 8px; align-items: center; }
  .agenda-controles select { width: auto; padding: 9px 12px; font-size: 14px; }
  .agenda-layout { display: grid; grid-template-columns: 270px 1fr; gap: 20px; align-items: start; }

  /* Calendario chico */
  .calendario { background: var(--blanco); border-radius: var(--radio); padding: 16px; }
  .cal-cabecera { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-mes { font-weight: 600; }
  .cal-mes::first-letter, .hoja-mes::first-letter, .hoja-dia::first-letter { text-transform: uppercase; }
  .cal-flecha {
    background: none; border: none; font-size: 18px; color: var(--gris);
    width: 30px; height: 30px; border-radius: 6px;
  }
  .cal-flecha:hover { background: var(--fondo); color: var(--texto); }
  .cal-grilla { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal-nombre-dia { font-size: 12px; color: var(--gris); font-weight: 500; padding: 4px 0; }
  .cal-dia {
    position: relative; aspect-ratio: 1; border: none; background: none;
    border-radius: 8px; font-size: 14px; color: var(--texto);
  }
  .cal-dia:hover { background: var(--fondo); }
  .cal-dia.hoy { color: var(--azul-claro); font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--azul-claro); }
  .cal-dia.seleccionado { background: var(--azul); color: #fff; font-weight: 600; }
  .cal-dia.pendiente::after {
    content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    width: 5px; height: 5px; border-radius: 50%; background: #ef4444;
  }
  .cal-dia.seleccionado.pendiente::after { background: #fff; }
  .cal-hoy { width: 100%; margin-top: 12px; }

  /* Hoja de agenda de papel */
  .hoja {
    background: var(--papel); border-radius: 6px 12px 12px 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.06);
    border-left: 10px solid #d6c9a6; overflow: hidden; position: relative;
  }
  .hoja-encabezado {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 10px; border-bottom: 2px solid var(--margen-rojo);
  }
  .hoja-fecha { text-align: center; }
  .hoja-dia { font-family: 'Caveat', cursive; font-size: 40px; color: var(--tinta); line-height: 1; }
  .hoja-mes { font-family: 'Caveat', cursive; font-size: 22px; color: var(--gris); }
  .sello-hoy {
    position: absolute; top: 14px; right: 64px; transform: rotate(8deg);
    border: 2px solid var(--rojo); color: var(--rojo); font-weight: 700;
    padding: 2px 8px; border-radius: 6px; font-size: 13px; letter-spacing: 1px; opacity: .8;
  }
  .hoja-flecha {
    background: none; border: 1px solid var(--renglon); color: var(--tinta);
    width: 36px; height: 36px; border-radius: 50%; font-size: 18px;
  }
  .hoja-flecha:hover { background: #f7f0dc; }

  .hoja-seccion { padding: 10px 20px 12px 0; border-bottom: 1px solid var(--renglon); display: flex; }
  .hoja-seccion-titulo {
    width: 76px; flex-shrink: 0; text-align: right; padding-right: 14px;
    font-family: 'Caveat', cursive; font-size: 19px; color: var(--gris); line-height: 1.2;
  }
  .hoja-seccion-items { flex: 1; border-left: 2px solid var(--margen-rojo); padding-left: 14px; min-height: 30px; }

  .renglon { display: flex; cursor: pointer; border-bottom: 1px solid var(--renglon); min-height: 46px; }
  .renglon:hover { background: #fbf6e6; }
  .renglon-hora {
    width: 76px; flex-shrink: 0; text-align: right; padding: 12px 14px 0 0;
    font-size: 13px; color: var(--gris); font-variant-numeric: tabular-nums;
  }
  .renglon-items {
    flex: 1; border-left: 2px solid var(--margen-rojo); padding: 6px 14px;
    display: flex; flex-direction: column; gap: 4px; justify-content: center;
  }
  .agregar-aqui { color: transparent; font-size: 13px; }
  .renglon:hover .agregar-aqui { color: #b5a77f; }

  .anotacion {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 6px 10px; border-radius: 6px; cursor: pointer;
    background: rgba(255,255,255,.7); border: 1px solid transparent;
  }
  .anotacion:hover { border-color: var(--renglon); background: #fff; }
  .anotacion input[type=checkbox] { width: 18px; height: 18px; margin-top: 3px; flex-shrink: 0; accent-color: var(--verde); cursor: pointer; }
  .anot-texto { flex: 1; min-width: 0; }
  .anot-hora { font-weight: 600; color: var(--azul-claro); margin-right: 6px; font-size: 14px; }
  .anot-titulo { font-family: 'Caveat', cursive; font-size: 22px; color: var(--tinta); line-height: 1.15; }
  .anot-notas { font-size: 13px; color: var(--gris); margin-top: 2px; white-space: pre-wrap; }
  .anot-para {
    display: inline-block; font-size: 12px; background: #eef2f8; color: var(--azul-claro);
    padding: 1px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle;
  }
  .anotacion.hecha .anot-titulo { text-decoration: line-through; text-decoration-color: var(--rojo); opacity: .55; }
  .anotacion.hecha .anot-hora, .anotacion.hecha .anot-notas { opacity: .55; }
  .link-agregar {
    background: none; border: none; color: #a8986b; font-size: 14px; padding: 6px 0;
  }
  .link-agregar:hover { color: var(--tinta); text-decoration: underline; }

  /* ---------- VENTANA (modal) ---------- */
  .modal-fondo {
    position: fixed; inset: 0; background: rgba(15,23,42,.45);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal {
    background: #fff; width: 100%; max-width: 460px; border-radius: 14px;
    padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,.25); max-height: 92vh; overflow-y: auto;
  }
  .modal h2 { font-size: 19px; margin-bottom: 18px; }
  .fila-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-botones { display: flex; gap: 8px; align-items: center; margin-top: 6px; }

  .modal.ancho { max-width: 660px; }
  .fila-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .check-linea { display: flex; gap: 8px; align-items: center; font-weight: 400; cursor: pointer; margin-bottom: 12px; }
  .check-linea input { width: auto; }
  .aviso-info { background: #eef2f8; color: var(--azul); padding: 12px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }

  /* ---------- CLIENTES / COMPAÑÍAS ---------- */
  .cabecera-seccion {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px; flex-wrap: wrap;
  }
  .barra-busqueda { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .barra-busqueda input { flex: 1 1 300px; }
  .barra-busqueda select { flex: 0 1 210px; width: auto; }
  .fila-click { cursor: pointer; }
  .fila-click:hover td { background: #f5f8fc; }
  .chip.gris { background: #f1f5f9; color: var(--gris); }
  .chip.azul { background: #e0ecfa; color: var(--azul-claro); }
  .pie-tabla { padding: 10px 16px; font-size: 13px; color: var(--gris); }

  .selector-tipo { display: flex; gap: 10px; margin-bottom: 18px; }
  .selector-tipo label {
    flex: 1; margin: 0; padding: 12px; border: 1.5px solid var(--borde); border-radius: 10px;
    display: flex; gap: 8px; align-items: center; cursor: pointer; font-weight: 500;
  }
  .selector-tipo input { width: auto; accent-color: var(--azul); }
  .selector-tipo label:has(input:checked) { border-color: var(--azul-claro); background: #eef2f8; }

  /* Ficha del cliente */
  .volver { background: none; border: none; color: var(--azul-claro); font-size: 14px; margin-bottom: 12px; padding: 0; }
  .volver:hover { text-decoration: underline; }
  .ficha-titulo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ficha-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; margin-top: 18px; }
  .tarjeta { background: var(--blanco); border-radius: var(--radio); padding: 18px; }
  .tarjeta-titulo { font-weight: 600; margin-bottom: 4px; }
  .datos-lista dt { font-size: 12px; color: var(--gris); text-transform: uppercase; letter-spacing: .04em; margin-top: 14px; }
  .datos-lista dd { word-break: break-word; white-space: pre-wrap; }
  .datos-lista a { color: var(--azul-claro); }
  .panel-titulo.con-boton { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .historial-form { padding: 14px 18px; border-bottom: 1px solid var(--borde); display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
  .historial-form select { width: auto; }
  .historial-form textarea { flex: 1 1 260px; min-height: 44px; }
  .historial-item { padding: 12px 18px; border-bottom: 1px solid var(--borde); display: flex; gap: 12px; align-items: flex-start; }
  .historial-item:last-child { border-bottom: none; }
  .historial-icono { font-size: 18px; line-height: 1.3; }
  .historial-meta { font-size: 12px; color: var(--gris); margin-bottom: 2px; }
  .historial-detalle { white-space: pre-wrap; word-break: break-word; }
  .btn-mini { background: none; border: none; color: var(--gris); padding: 2px 8px; border-radius: 6px; }
  .btn-mini:hover { background: var(--rojo-fondo); color: var(--rojo); }

  /* ---------- VENTAS EN CURSO (tablero) ---------- */
  .tablero {
    display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr));
    gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: start;
  }
  .columna {
    background: #eaeef3; border-radius: 12px; padding: 10px;
    min-height: 260px; display: flex; flex-direction: column; gap: 8px;
    transition: background .15s;
  }
  .columna.recibiendo { background: #dbe5f1; outline: 2px dashed var(--azul-claro); }
  .columna-cabecera { padding: 4px 4px 10px; border-bottom: 3px solid var(--color-etapa); margin-bottom: 2px; }
  .columna-nombre { font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .columna-cantidad {
    background: #fff; border-radius: 999px; font-size: 12px; padding: 1px 9px; color: var(--gris);
  }
  .columna-total { font-size: 12px; color: var(--gris); margin-top: 2px; }
  .columna-vacia { font-size: 13px; color: #94a3b8; text-align: center; padding: 18px 6px; }
  .tarjeta-venta {
    background: #fff; border-radius: 9px; padding: 10px 12px; cursor: grab;
    box-shadow: 0 1px 2px rgba(0,0,0,.08); border-left: 4px solid var(--color-etapa);
  }
  .tarjeta-venta:hover { box-shadow: 0 3px 10px rgba(0,0,0,.1); }
  .tarjeta-venta.arrastrando { opacity: .4; }
  .tv-titulo { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .tv-cliente { font-size: 13px; color: var(--azul-claro); margin-top: 2px; }
  .tv-meta { font-size: 12px; color: var(--gris); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .tv-monto { font-weight: 600; color: var(--texto); }
  .tv-atrasada { color: var(--rojo); font-weight: 600; }
  .tv-motivo { font-size: 12px; color: var(--rojo); margin-top: 4px; font-style: italic; }
  .tv-interesado {
    font-size: 11px; background: var(--amarillo-fondo); color: #92400e;
    padding: 0 7px; border-radius: 999px; margin-left: 4px; vertical-align: middle;
  }
  .tv-telefono { font-size: 12px; color: var(--gris); }
  .tv-accion { font-size: 12px; margin-top: 7px; color: #1e40af; background: #eef2ff; padding: 4px 7px; border-radius: 6px; }
  .tv-accion.atrasada { color: var(--rojo); background: var(--rojo-fondo); }
  .tv-sin-accion { font-size: 12px; margin-top: 7px; color: #b45309; }
  .tv-mover { display: flex; justify-content: space-between; gap: 4px; margin-top: 8px; }
  .tv-mover button {
    background: var(--fondo); border: none; border-radius: 6px; padding: 3px 9px; font-size: 12px; color: var(--gris);
  }
  .tv-mover button:hover { background: #dde3ea; color: var(--texto); }

  /* ---------- CONTACTOS DE COMPAÑÍAS ---------- */
  .grupo-contactos { margin-bottom: 14px; }
  .contactos-grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; padding: 12px; }

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, '0');

// Evita que texto cargado por usuarios rompa la página
function escapar(texto) {
  if (texto === null || texto === undefined) return '';
  return String(texto)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Fechas en formato 'AAAA-MM-DD' usando la hora de Argentina (la de la compu)
function hoyISO() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function aFecha(iso) {
  const [a, m, d] = iso.split('-').map(Number);
  return new Date(a, m - 1, d);
}
function aISO(fecha) {
  return `${fecha.getFullYear()}-${pad(fecha.getMonth() + 1)}-${pad(fecha.getDate())}`;
}
function sumarDias(iso, n) {
  const f = aFecha(iso);
  f.setDate(f.getDate() + n);
  return aISO(f);
}
function formatearFecha(fechaISO) {
  if (!fechaISO) return '-';
  const [a, m, d] = fechaISO.split('-');
  return `${d}/${m}/${a}`;
}
const horaCorta = (h) => (h ? h.slice(0, 5) : '');

function textoDias(dias) {
  if (dias < 0) return `Vencida hace ${Math.abs(dias)} día${Math.abs(dias) === 1 ? '' : 's'}`;
  if (dias === 0) return 'Vence HOY';
  if (dias === 1) return 'Vence mañana';
  return `Faltan ${dias} días`;
}

const NOMBRES_PAGO = { tarjeta_credito: 'Tarjeta de crédito', cbu: 'CBU', cupon: 'Cupón' };
const COBERTURAS = ['Responsabilidad civil', 'Terceros completo', 'Terceros completo con granizo',
  'Terceros completo full', 'Todo riesgo con franquicia', 'Todo riesgo sin franquicia'];
const MARCAS = ['Chevrolet', 'Citroën', 'Fiat', 'Ford', 'Honda', 'Hyundai', 'Jeep', 'Kia', 'Mercedes-Benz',
  'Nissan', 'Peugeot', 'Renault', 'Toyota', 'Volkswagen', 'Audi', 'BMW', 'Chery', 'Suzuki', 'Yamaha',
  'Motomel', 'Zanella', 'Gilera', 'Corven', 'Bajaj', 'Ram', 'Dodge', 'Mitsubishi', 'BYD'];
const esRamoVehiculo = (nombre) => /auto|moto/i.test(nombre || '');

// Convierte lo que se escribió en un link seguro (agrega https:// si falta)
function urlSegura(texto) {
  let u = String(texto || '').trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u.replace(/^\/+/, '');
  try {
    const url = new URL(u);
    return /^https?:$/.test(url.protocol) ? url.href : '';
  } catch { return ''; }
}
const textoUrl = (u) => String(u || '').replace(/^https?:\/\//i, '').replace(/\/$/, '');
// data-accion="link" hace que el clic abra el link sin abrir también la fila
const linkWeb = (u, texto, clase = 'link-web') => {
  const url = urlSegura(u);
  return url ? `<a class="${clase}" data-accion="link" href="${escapar(url)}" target="_blank" rel="noopener noreferrer">${texto ?? escapar(textoUrl(u))}</a>` : '';
};

function estadoCarnet(fechaISO) {
  if (!fechaISO) return null;
  const hoy = hoyISO();
  if (fechaISO < hoy) return 'vencido';
  if (fechaISO.slice(0, 7) === hoy.slice(0, 7)) return 'mes';
  return null;
}
function chipCarnet(fechaISO, corto = false) {
  const e = estadoCarnet(fechaISO);
  if (e === 'mes') return `<span class="chip naranja">🪪 ${corto ? 'Carnet vence' : 'Vence este mes:'} ${formatearFecha(fechaISO).slice(0, 5)}</span>`;
  if (e === 'vencido') return `<span class="chip rojo">🪪 Carnet vencido${corto ? '' : ' el ' + formatearFecha(fechaISO)}</span>`;
  return '';
}

// Texto corto del bien asegurado: "AB123CD · Ford Ka SE 2019" o lo que se haya escrito
function descripcionBien(p) {
  const vehiculo = [p.vehiculo_marca, p.vehiculo_version, p.vehiculo_anio].filter(Boolean).join(' ');
  const partes = [p.patente, vehiculo].filter(Boolean);
  if (partes.length) return partes.join(' · ');
  return p.bien_asegurado || '';
}

let esAdmin = false;     // si el usuario logueado es administrador

let supervisados = [];   // usuarios cuya cartera ve la administradora
let miPerfil = null;

async function cargarPerfiles() {
  // Se piden los datos más nuevos; si falta correr algún SQL, se piden menos
  let data = null;
  for (const columnas of [
    'id, nombre, email, es_admin, visible_admin, carga_inicial_at, link_otros_seguros',
    'id, nombre, email, es_admin, visible_admin, carga_inicial_at',
    'id, nombre, email, es_admin',
    'id, nombre, email',
  ]) {
    const r = await db.from('perfiles').select(columnas).order('nombre');
    if (!r.error) { data = r.data; break; }
  }
  perfilesLista = data || [];
  perfiles = {};
  perfilesLista.forEach((p) => { perfiles[p.id] = p.nombre || p.email; });
  miPerfil = perfilesLista.find((p) => p.id === usuarioId) || null;
  esAdmin = !!miPerfil?.es_admin;
  supervisados = esAdmin ? perfilesLista.filter((p) => p.visible_admin && p.id !== usuarioId) : [];
  $('menu-usuarios').classList.toggle('oculto', !esAdmin);
}

// Selector "¿De qué cartera?" (solo para la administradora con usuarios supervisados)
function selectorCartera(id, valor) {
  if (!supervisados.length) return '';
  return `<select id="${id}" aria-label="Cartera">
    <option value="mia" ${sel('mia', valor)}>Mi cartera</option>
    ${supervisados.map((p) => `<option value="${p.id}" ${sel(p.id, valor)}>Cartera de ${escapar(p.nombre || p.email)}</option>`).join('')}
    <option value="todas" ${sel('todas', valor)}>Todas las carteras</option>
  </select>`;
}
function filtrarCartera(consulta, valor) {
  if (!supervisados.length || valor === 'todas') return consulta;
  return consulta.eq('usuario_id', valor === 'mia' || !valor ? usuarioId : valor);
}

// Traduce los errores de la base de datos a algo entendible
function errorDB(error) {
  if (!error) return '';
  switch (error.code) {
    case '23505': return 'Ya existe un registro con ese dato (por ejemplo, el mismo nombre o DNI/CUIT).';
    case '23503': return 'No se puede eliminar porque tiene datos relacionados (por ejemplo, pólizas cargadas).';
    case '23514': return 'Faltan datos obligatorios o hay fechas que no cierran.';
  }
  if ((error.message || '').toLowerCase().includes('fetch')) return 'No hay conexión con el servidor. Revisá tu internet.';
  return error.message;
}

const modal = { onGuardar: null, onEliminar: null, confirmarEliminar: '' };

function abrirModal({ titulo, cuerpo, onGuardar, onEliminar = null, confirmarEliminar = '¿Seguro que querés eliminarlo?', ancho = false, textoGuardar = 'Guardar' }) {
  const form = $('form-general');

function mostrarErrorModal(texto) {
  const caja = $('modal-error');

  caja.classList.remove('oculto');

$('form-general').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!modal.onGuardar) return;
  const boton = $('modal-guardar');
  boton.disabled = true;
  const datos = Object.fromEntries(new FormData(e.target));
  const error = await modal.onGuardar(datos);
  boton.disabled = false;
  if (error) mostrarErrorModal(error);
  else cerrarModal();
});

$('form-general').addEventListener('click', async (e) => {
  const boton = e.target.closest('[data-modal]');
  if (!boton) return;
  if (boton.dataset.modal === 'cancelar') cerrarModal();
  if (boton.dataset.modal === 'eliminar' && modal.onEliminar) {
    if (!confirm(modal.confirmarEliminar)) return;
    const error = await modal.onEliminar();
    if (error) mostrarErrorModal(error);
    else cerrarModal();
  }
});

function traducirError(mensaje) {
  if (!mensaje) return 'Ocurrió un error. Probá de nuevo.';
  if (mensaje.includes('Invalid login credentials')) return 'Email o contraseña incorrectos.';
  if (mensaje.includes('Email not confirmed')) return 'Este usuario todavía no está confirmado.';
  if (mensaje.toLowerCase().includes('fetch')) return 'No hay conexión con el servidor. Revisá tu internet.';
  return mensaje;
}

async function actualizarAlertaDia() {
  if (!usuarioId) return;
  const hoy = hoyISO();

  const { data, error } = await db
    .from('agenda')
    .select('*')
    .eq('para', usuarioId)
    .eq('completado', false)
    .lte('fecha', hoy)
    .order('fecha', { ascending: true })
    .order('hora', { ascending: true, nullsFirst: true });

  if (error) return;

  const deHoy = data.filter((a) => a.fecha === hoy);
  const atrasadas = data.filter((a) => a.fecha < hoy);

  // Globito rojo en el menú
  const badge = $('badge-agenda');
  badge.textContent = data.length;
  badge.classList.toggle('oculto', data.length === 0);

  const caja = $('alerta-dia');
  if (alertaCerrada || data.length === 0) {
    caja.innerHTML = '';
    return;
  }

  let titulo;
  if (deHoy.length > 0) {
    titulo = `Hoy tenés ${deHoy.length} ${deHoy.length === 1 ? 'cosa' : 'cosas'} para hacer`;
  } else {
    titulo = 'Para hoy no tenés nada nuevo, pero quedaron cosas pendientes';
  }
  const textoAtrasadas = atrasadas.length > 0
    ? ` · <span class="atrasadas">${atrasadas.length} atrasada${atrasadas.length === 1 ? '' : 's'}</span>`
    : '';

  const lista = deHoy.length > 0 ? deHoy : atrasadas;
  const MAX = 4;
  const items = lista.slice(0, MAX).map((a) => {
    const cuando = a.fecha < hoy ? `${formatearFecha(a.fecha)} ` : '';
    const hora = horaCorta(a.hora);
    return `<li><span class="hora-alerta">${cuando}${hora || (a.fecha < hoy ? '' : 'En el día')}</span>${escapar(a.titulo)}</li>`;
  }).join('');
  const resto = lista.length > MAX ? `<li>…y ${lista.length - MAX} más</li>` : '';

  caja.innerHTML = `
    <div class="alerta-dia">
      <div class="alerta-icono">📌</div>
      <div class="alerta-texto">
        <strong>${titulo}</strong>${textoAtrasadas}
        <ul>${items}${resto}</ul>
      </div>
      <div class="alerta-acciones">
        <button class="btn-secundario" data-alerta="ver">Ver agenda</button>
        <button class="btn-cerrar-alerta" data-alerta="cerrar" aria-label="Cerrar aviso">✕</button>
      </div>
    </div>`;
}

const agenda = {
  fecha: hoyISO(),     // día que se está mirando
  filtro: 'mias',      // 'mias' = solo lo mío, 'todas' = de todos
  calAnio: 0,          // mes visible en el calendario chico
  calMes: 0,
  cache: {},           // anotaciones del día, por id
  editando: null,      // id de la anotación que se está editando
};
const HORA_DESDE = 7;
const HORA_HASTA = 21;

function sincronizarCalendario() {
  const [a, m] = agenda.fecha.split('-').map(Number);
  agenda.calAnio = a;
  agenda.calMes = m;
}
sincronizarCalendario();

function refrescarAgenda() {
  if (!$('hoja')) return; // no estamos en la agenda
  dibujarCalendario();
  dibujarHoja();
}

function aplicarFiltro(consulta) {
  return agenda.filtro === 'mias' ? consulta.eq('para', usuarioId) : consulta;
}

// ---------- Calendario chico del mes ----------
async function dibujarCalendario() {
  const a = agenda.calAnio;
  const m = agenda.calMes;
  const ultimoDia = new Date(a, m, 0).getDate();
  const desde = `${a}-${pad(m)}-01`;
  const hasta = `${a}-${pad(m)}-${pad(ultimoDia)}`;

  const { data } = await aplicarFiltro(
    db.from('agenda').select('fecha').eq('completado', false).gte('fecha', desde).lte('fecha', hasta)
  );
  const diasConPendientes = new Set((data || []).map((r) => r.fecha));

  const caja = $('calendario');
  if (!caja) return;

  const nombreMes = new Date(a, m - 1, 1).toLocaleDateString('es-AR', { month: 'long', year: 'numeric' });
  const huecos = (new Date(a, m - 1, 1).getDay() + 6) % 7; // semana empieza el lunes
  const hoy = hoyISO();

  let celdas = ['L', 'M', 'M', 'J', 'V', 'S', 'D']
    .map((d) => `<div class="cal-nombre-dia">${d}</div>`).join('');
  celdas += '<div></div>'.repeat(huecos);
  for (let d = 1; d <= ultimoDia; d++) {
    const iso = `${a}-${pad(m)}-${pad(d)}`;
    const clases = ['cal-dia'];
    if (iso === hoy) clases.push('hoy');
    if (iso === agenda.fecha) clases.push('seleccionado');
    if (diasConPendientes.has(iso)) clases.push('pendiente');
    celdas += `<button class="${clases.join(' ')}" data-accion="dia" data-fecha="${iso}">${d}</button>`;
  }

  caja.innerHTML = `
    <div class="cal-cabecera">
      <button class="cal-flecha" data-accion="mes-ant" aria-label="Mes anterior">‹</button>
      <div class="cal-mes">${nombreMes}</div>
      <button class="cal-flecha" data-accion="mes-sig" aria-label="Mes siguiente">›</button>
    </div>
    <div class="cal-grilla">${celdas}</div>
    <button class="btn-secundario cal-hoy" data-accion="hoy">Ir a hoy</button>`;
}

// ---------- Hoja del día ----------
function htmlAnotacion(a) {
  const paraOtro = a.para && a.para !== usuarioId;
  const para = paraOtro || agenda.filtro === 'todas'
    ? `<span class="anot-para">${escapar(perfiles[a.para] || 'Sin asignar')}</span>`
    : '';
  return `
    <div class="anotacion ${a.completado ? 'hecha' : ''}" data-accion="editar" data-id="${a.id}">
      <input type="checkbox" data-accion="check" data-id="${a.id}" ${a.completado ? 'checked' : ''}
             aria-label="Marcar como hecha">
      <div class="anot-texto">
        ${a.hora ? `<span class="anot-hora">${horaCorta(a.hora)}</span>` : ''}
        <span class="anot-titulo">${escapar(a.titulo)}</span>${para}
        ${a.notas ? `<div class="anot-notas">${escapar(a.notas)}</div>` : ''}
      </div>
    </div>`;
}

async function dibujarHoja() {
  const fechaMirada = agenda.fecha;
  const { data, error } = await aplicarFiltro(
    db.from('agenda').select('*').eq('fecha', fechaMirada)
      .order('hora', { ascending: true, nullsFirst: true })
      .order('created_at', { ascending: true })
  );

  const hoja = $('hoja');
  if (!hoja || fechaMirada !== agenda.fecha) return; // se cambió de día mientras cargaba

  if (error) {
    hoja.innerHTML = `<div class="vacio"><div class="mensaje-error">No se pudo cargar la agenda: ${escapar(error.message)}</div></div>`;
    return;
  }

  agenda.cache = {};
  data.forEach((a) => { agenda.cache[a.id] = a; });

  const sinHora = data.filter((a) => !a.hora);
  const porHora = {};
  data.filter((a) => a.hora).forEach((a) => {
    const h = Number(a.hora.slice(0, 2));
    (porHora[h] = porHora[h] || []).push(a);
  });

  const horas = new Set();
  for (let h = HORA_DESDE; h <= HORA_HASTA; h++) horas.add(h);
  Object.keys(porHora).forEach((h) => horas.add(Number(h)));
  const horasOrdenadas = [...horas].sort((x, y) => x - y);

  const fecha = aFecha(fechaMirada);
  const diaTexto = fecha.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric' });
  const mesTexto = fecha.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' });
  const esHoy = fechaMirada === hoyISO();

  const renglones = horasOrdenadas.map((h) => {
    const items = (porHora[h] || []).map(htmlAnotacion).join('');
    return `
      <div class="renglon" data-accion="nueva" data-hora="${pad(h)}:00">
        <div class="renglon-hora">${pad(h)}:00</div>
        <div class="renglon-items">${items || '<span class="agregar-aqui">+ anotar</span>'}</div>
      </div>`;
  }).join('');

  hoja.innerHTML = `
    ${esHoy ? '<div class="sello-hoy">HOY</div>' : ''}
    <div class="hoja-encabezado">
      <button class="hoja-flecha" data-accion="dia-ant" aria-label="Día anterior">‹</button>
      <div class="hoja-fecha">
        <div class="hoja-dia">${diaTexto}</div>
        <div class="hoja-mes">${mesTexto}</div>
      </div>
      <button class="hoja-flecha" data-accion="dia-sig" aria-label="Día siguiente">›</button>
    </div>

    <div class="hoja-seccion">
      <div class="hoja-seccion-titulo">Para hoy</div>
      <div class="hoja-seccion-items">
        ${sinHora.map(htmlAnotacion).join('')}
        <button class="link-agregar" data-accion="nueva" data-hora="">+ agregar sin horario</button>
      </div>
    </div>

    ${renglones}`;
}

// ---------- Clics dentro de la agenda ----------
$('contenido').addEventListener('click', async (e) => {
  const el = e.target.closest('[data-accion]');
  if (!el) return;

  switch (el.dataset.accion) {
    case 'nueva':
      abrirModalAgenda(null, el.dataset.hora || '');
      break;
    case 'editar':
      abrirModalAgenda(agenda.cache[el.dataset.id]);
      break;
    case 'check':
      e.stopPropagation();
      await cambiarCompletado(el.dataset.id, el.checked);
      break;
    case 'dia':
      agenda.fecha = el.dataset.fecha;
      sincronizarCalendario();
      refrescarAgenda();
      break;
    case 'dia-ant':
    case 'dia-sig':
      agenda.fecha = sumarDias(agenda.fecha, el.dataset.accion === 'dia-ant' ? -1 : 1);
      sincronizarCalendario();
      refrescarAgenda();
      break;
    case 'mes-ant':
    case 'mes-sig': {
      const f = new Date(agenda.calAnio, agenda.calMes - 1 + (el.dataset.accion === 'mes-ant' ? -1 : 1), 1);
      agenda.calAnio = f.getFullYear();
      agenda.calMes = f.getMonth() + 1;
      dibujarCalendario();
      break;
    }
    case 'hoy':
      agenda.fecha = hoyISO();
      sincronizarCalendario();
      refrescarAgenda();
      break;
  }
});

async function cambiarCompletado(id, completado) {
  const { error } = await db.from('agenda').update({ completado }).eq('id', id);
  if (error) alert('No se pudo guardar: ' + error.message);
  refrescarAgenda();

}

// ---------- Ventana para crear / editar ----------
function abrirModalAgenda(anotacion, hora = '', extra = {}) {
  agenda.editando = anotacion ? anotacion.id : null;
  agenda.nuevoClienteId = anotacion ? null : (extra.clienteId || null);
  agenda.nuevaOportunidadId = anotacion ? null : (extra.oportunidadId || null);
  agenda.nuevoSiniestroId = anotacion ? null : (extra.siniestroId || null);

  $('modal-agenda-titulo').textContent = anotacion ? 'Editar anotación' : 'Nueva anotación';
  $('ag-titulo').value = anotacion ? anotacion.titulo : (extra.titulo || '');
  $('ag-fecha').value = anotacion ? anotacion.fecha : agenda.fecha;
  $('ag-hora').value = anotacion ? horaCorta(anotacion.hora) : hora;
  $('ag-notas').value = anotacion ? (anotacion.notas || '') : (extra.notas || '');

  const elegido = anotacion ? anotacion.para : usuarioId;
  $('ag-para').innerHTML = Object.entries(perfiles)
    .map(([id, nombre]) => `<option value="${id}" ${id === elegido ? 'selected' : ''}>${escapar(nombre)}${id === usuarioId ? ' (yo)' : ''}</option>`)
    .join('');

  $('ag-eliminar').classList.toggle('oculto', !anotacion);
  $('modal-agenda').classList.remove('oculto');
  $('ag-titulo').focus();
}

function cerrarModalAgenda() {
  $('modal-agenda').classList.add('oculto');
  agenda.editando = null;
}

$('ag-cancelar').addEventListener('click', cerrarModalAgenda);
$('modal-agenda').addEventListener('click', (e) => {
  if (e.target === $('modal-agenda')) cerrarModalAgenda();
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('modal-agenda').classList.contains('oculto')) cerrarModalAgenda();
  if (!$('modal-general').classList.contains('oculto')) cerrarModal();
});

$('form-agenda').addEventListener('submit', async (e) => {
  e.preventDefault();
  const boton = $('ag-guardar');
  boton.disabled = true;

  const datos = {
    titulo: $('ag-titulo').value.trim(),
    fecha: $('ag-fecha').value,
    hora: $('ag-hora').value || null,
    para: $('ag-para').value || usuarioId,
    notas: $('ag-notas').value.trim() || null,
  };
  if (!agenda.editando && agenda.nuevoClienteId) datos.cliente_id = agenda.nuevoClienteId;
  if (!agenda.editando && agenda.nuevaOportunidadId) datos.oportunidad_id = agenda.nuevaOportunidadId;
  if (!agenda.editando && agenda.nuevoSiniestroId) datos.siniestro_id = agenda.nuevoSiniestroId;

  const { error } = agenda.editando
    ? await db.from('agenda').update(datos).eq('id', agenda.editando)
    : await db.from('agenda').insert(datos);

  boton.disabled = false;
  if (error) {
    alert('No se pudo guardar: ' + error.message);
    return;
  }

  // Si se agendó para otro día, la agenda salta a ese día
  agenda.fecha = datos.fecha;
  sincronizarCalendario();
  cerrarModalAgenda();
  refrescarAgenda();
  actualizarAlertaDia();
  if (seccionActual === 'ventas') cargarVentas(); // actualiza "próxima acción" en las tarjetas
  if (seccionActual === 'siniestros') buscarSiniestros();
  if (seccionActual === 'ficha-siniestro' && fichaSiniestro) verSiniestro(fichaSiniestro.siniestro.id);
});

$('ag-eliminar').addEventListener('click', async () => {
  if (!agenda.editando) return;
  if (!confirm('¿Seguro que querés eliminar esta anotación?')) return;
  const { error } = await db.from('agenda').delete().eq('id', agenda.editando);
  if (error) {
    alert('No se pudo eliminar: ' + error.message);
    return;
  }
  cerrarModalAgenda();
  refrescarAgenda();
  actualizarAlertaDia();
});

// Devuelve los ids de clientes que cumplen el buscador y los filtros (null = sin filtro)
async function calcularIdsClientes() {
  const texto = busq.texto.replace(/[,()*%\\]/g, ' ').trim();
  const digitos = texto.replace(/\D/g, '');
  let ids = null;

  // Filtro por compañía y/o ramo: clientes que tengan alguna póliza así
  if (busq.compania || busq.ramo) {
    let q = db.from('polizas').select('cliente_id');
    if (busq.compania) q = q.eq('compania_id', busq.compania);
    if (busq.ramo) q = q.eq('ramo_id', busq.ramo);
    const { data } = await q;
    ids = new Set((data || []).map((p) => p.cliente_id));
  }

  // Búsqueda por texto: nombre (todas las palabras), DNI/CUIT, N° de póliza o patente
  if (texto) {
    let porNombre = db.from('clientes').select('id');
    texto.split(/\s+/).forEach((palabra) => { porNombre = porNombre.ilike('nombre_mostrar', `%${palabra}%`); });
    const sinEspacios = texto.replace(/\s/g, '');
    const consultas = [
      porNombre,
      db.from('polizas').select('cliente_id').or(`numero_poliza.ilike.%${texto}%,patente.ilike.%${sinEspacios}%`),
    ];
    if (digitos.length >= 3) consultas.push(db.from('clientes').select('id').ilike('dni_cuit', `%${digitos}%`));

    const resultados = await Promise.all(consultas);
    const encontrados = new Set();
    resultados.forEach((r) => (r.data || []).forEach((fila) => encontrados.add(fila.id || fila.cliente_id)));
    ids = ids ? new Set([...ids].filter((id) => encontrados.has(id))) : encontrados;
  }
  return ids;
}

function consultaClientes(ids, columnas, opcionesSelect) {
  let q = db.from('clientes').select(columnas, opcionesSelect).eq('activo', true).order('nombre_mostrar').order('id');
  if (ids) q = q.in('id', [...ids]);
  return filtrarCartera(q, busq.cartera);
}

async function buscarClientes() {
  const miBusqueda = ++numeroBusqueda;
  const ids = await calcularIdsClientes();
  if (miBusqueda !== numeroBusqueda) return; // ya hay una búsqueda más nueva
  idsBusquedaClientes = ids;
  const caja = $('lista-clientes');
  if (!caja) return;

  if (ids && ids.size === 0) {
    caja.innerHTML = vacio('🔍', 'No se encontraron clientes con esa búsqueda.');
    return;
  }

  const desde = busq.pagina * POR_PAGINA;
  const { data, error, count } = await consultaClientes(ids, '*, polizas(estado)', { count: 'exact' })
    .range(desde, desde + POR_PAGINA - 1);

  if (miBusqueda !== numeroBusqueda || !$('lista-clientes')) return;
  if (error) {
    caja.innerHTML = `<div class="vacio"><div class="mensaje-error">${escapar(errorDB(error))}</div></div>`;
    return;
  }
  // Si la página quedó vacía (por ejemplo, después de dar de baja), volver a la anterior
  if (data.length === 0 && busq.pagina > 0) {
    busq.pagina = Math.max(0, Math.ceil((count || 0) / POR_PAGINA) - 1);
    buscarClientes();
    return;
  }
  if (data.length === 0) {
    caja.innerHTML = ids
      ? vacio('🔍', 'No se encontraron clientes con esa búsqueda.')
      : vacio('👥', 'Todavía no hay clientes cargados.<br>Tocá "+ Nuevo cliente" para agregar el primero.');
    return;
  }

  const filas = data.map((c) => {
    const vigentes = (c.polizas || []).filter((p) => p.estado === 'vigente').length;
    return `
      <tr class="fila-click" data-accion="ver-cliente" data-id="${c.id}">
        <td><strong>${escapar(c.nombre_mostrar)}</strong>${c.usuario_id !== usuarioId ? ` <span class="chip violeta">${escapar(perfiles[c.usuario_id] || '')}</span>` : ''} ${chipCarnet(c.vencimiento_carnet, true)}</td>
        <td><span class="chip ${c.tipo === 'empresa' ? 'azul' : 'gris'}">${c.tipo === 'empresa' ? 'Empresa' : 'Persona'}</span></td>
        <td>${escapar(c.dni_cuit) || '-'}</td>
        <td>${escapar(c.telefono) || '-'}</td>
        <td>${escapar(c.localidad) || '-'}</td>
        <td>${vigentes}</td>
      </tr>`;
  }).join('');

  const total = count || 0;
  const paginas = Math.max(1, Math.ceil(total / POR_PAGINA));
  caja.innerHTML = `
    <div class="tabla-contenedor"><table>
      <thead><tr><th>Nombre / Razón social</th><th>Tipo</th><th>DNI / CUIT</th><th>Teléfono</th><th>Localidad</th><th>Pólizas vigentes</th></tr></thead>
      <tbody>${filas}</tbody>
    </table></div>
    <div class="paginacion">
      <span>Mostrando ${desde + 1}–${desde + data.length} de ${total} cliente${total === 1 ? '' : 's'}</span>
      ${paginas > 1 ? `
      <div class="paginacion-botones">
        <button class="btn-secundario" data-accion="pagina-clientes" data-pagina="0" ${busq.pagina === 0 ? 'disabled' : ''} aria-label="Primera página">«</button>
        <button class="btn-secundario" data-accion="pagina-clientes" data-pagina="${busq.pagina - 1}" ${busq.pagina === 0 ? 'disabled' : ''}>‹ Anterior</button>
        <span class="pagina-actual">Página ${busq.pagina + 1} de ${paginas}</span>
        <button class="btn-secundario" data-accion="pagina-clientes" data-pagina="${busq.pagina + 1}" ${busq.pagina >= paginas - 1 ? 'disabled' : ''}>Siguiente ›</button>
        <button class="btn-secundario" data-accion="pagina-clientes" data-pagina="${paginas - 1}" ${busq.pagina >= paginas - 1 ? 'disabled' : ''} aria-label="Última página">»</button>
      </div>` : ''}
    </div>`;
}

$('contenido').addEventListener('click', (e) => {
  const b = e.target.closest('[data-accion="pagina-clientes"]');
  if (!b || b.disabled) return;
  busq.pagina = Number(b.dataset.pagina);
  buscarClientes();
  $('lista-clientes').scrollIntoView({ block: 'start', behavior: 'smooth' });
});

  abrirModal({
    titulo: c ? 'Editar cliente' : 'Nuevo cliente',
    ancho: true,
    cuerpo: `
      <div class="selector-tipo">
        <label><input type="radio" name="tipo" value="persona" ${tipo === 'persona' ? 'checked' : ''}> 👤 Persona</label>
        <label><input type="radio" name="tipo" value="empresa" ${tipo === 'empresa' ? 'checked' : ''}> 🏢 Empresa</label>
      </div>

      <div data-solo="persona">
        <div class="fila-2">

        </div>
        <div class="fila-3">
          <div class="campo"><label>Fecha de nacimiento</label><input type="date" name="fecha_nacimiento" value="${escapar(c?.fecha_nacimiento)}"></div>

              ${Object.entries(ESTADOS_CIVILES).map(([k, t]) => `<option value="${k}" ${sel(k, c?.estado_civil)}>${t}</option>`).join('')}
            </select>
          </div>

        </div>
        <div class="fila-3">
          <div class="campo"><label>🪪 Vencimiento del carnet</label><input type="date" name="vencimiento_carnet" value="${escapar(c?.vencimiento_carnet)}"></div>
        </div>
      </div>

      <div data-solo="empresa">
        <div class="campo"><label>Razón social *</label><input name="razon_social" maxlength="200" value="${escapar(c?.razon_social)}"></div>
      </div>

      <div class="fila-3">
        <div class="campo"><label>DNI / CUIT</label><input name="dni_cuit" inputmode="numeric" value="${escapar(c?.dni_cuit)}" placeholder="Solo números"></div>
        <div class="campo"><label>Teléfono</label><input name="telefono" type="tel" value="${escapar(c?.telefono)}"></div>
        <div class="campo"><label>Email</label><input name="email" type="email" value="${escapar(c?.email)}"></div>
      </div>
      <div class="campo"><label>Dirección</label><input name="direccion" value="${escapar(c?.direccion)}" placeholder="Calle, número, piso, depto"></div>
      <div class="fila-2">
        <div class="campo"><label>Localidad</label><input name="localidad" value="${escapar(c?.localidad)}"></div>
        <div class="campo"><label>Provincia</label>
          <select name="provincia"><option value="">-</option>
            ${PROVINCIAS.map((p) => `<option ${sel(p, provincia)}>${p}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="campo"><label>Notas</label><textarea name="notas" rows="2">${escapar(c?.notas)}</textarea></div>`,

    onGuardar: async (d) => {
      const esEmpresa = d.tipo === 'empresa';
      if (esEmpresa && !v(d, 'razon_social')) return 'Falta la razón social.';
      if (!esEmpresa && !v(d, 'nombre')) return 'Falta el nombre.';

      const datos = {
        tipo: d.tipo,
        nombre: esEmpresa ? null : v(d, 'nombre'),
        apellido: esEmpresa ? null : v(d, 'apellido'),
        fecha_nacimiento: esEmpresa ? null : v(d, 'fecha_nacimiento'),
        estado_civil: esEmpresa ? null : v(d, 'estado_civil'),
        profesion: esEmpresa ? null : v(d, 'profesion'),
        vencimiento_carnet: esEmpresa ? null : v(d, 'vencimiento_carnet'),
        razon_social: esEmpresa ? v(d, 'razon_social') : null,
        dni_cuit: (d.dni_cuit || '').replace(/\D/g, '') || null, // se guarda solo con números
        telefono: v(d, 'telefono'),
        email: v(d, 'email'),
        direccion: v(d, 'direccion'),
        localidad: v(d, 'localidad'),
        provincia: v(d, 'provincia'),
        notas: v(d, 'notas'),
      };

      const { data, error } = c
        ? await db.from('clientes').update(datos).eq('id', c.id).select().single()
        : await db.from('clientes').insert(datos).select().single();
      if (error) return error.code === '23505' ? 'Ya hay un cliente cargado con ese DNI/CUIT.' : errorDB(error);
      if (c) {
        verCliente(data.id);
      } else if (pre.onCreado) {
        pre.onCreado(data.id);
      } else {
        // Cliente nuevo: abre su ficha y ofrece cargarle la primera póliza
        verCliente(data.id).then(() => abrirFormPoliza());
      }
    },


  });

  // Mostrar u ocultar campos según sea persona o empresa
  const form = $('form-general');
  const actualizarTipo = () => {
    const t = form.querySelector('input[name=tipo]:checked').value;
    form.querySelectorAll('[data-solo]').forEach((el) => el.classList.toggle('oculto', el.dataset.solo !== t));
    form.querySelector('input[name=nombre]').required = t === 'persona';
    form.querySelector('input[name=razon_social]').required = t === 'empresa';
  };
  form.querySelectorAll('input[name=tipo]').forEach((r) => r.addEventListener('change', actualizarTipo));
  actualizarTipo();

  // Precarga de datos (cliente nuevo que viene de una venta)
  if (!c) {
    ['nombre', 'apellido', 'telefono', 'email'].forEach((campo) => {
      if (pre[campo]) form.querySelector(`[name=${campo}]`).value = pre[campo];
    });
  }
}

// =====================================================================
//  FICHA DEL CLIENTE (datos, pólizas e historial de contactos)
// =====================================================================
let fichaActual = null; // { cliente, polizas, contactos }

async function verCliente(id) {
  seccionActual = 'ficha';
  marcarMenu('clientes');
  window.scrollTo(0, 0);
  $('contenido').innerHTML = '<div class="vacio">Cargando...</div>';

  const [rc, rp, rh, rs] = await Promise.all([
    db.from('clientes').select('*').eq('id', id).single(),
    db.from('polizas').select('*').eq('cliente_id', id).order('fecha_vencimiento', { ascending: true }),
    db.from('contactos').select('*').eq('cliente_id', id).order('fecha', { ascending: false }),
    db.from('siniestros').select('id, tipo, estado, fecha_siniestro, numero_siniestro, compania_id')
      .eq('cliente_id', id).order('fecha_siniestro', { ascending: false }),
  ]);

  if (seccionActual !== 'ficha') return;
  if (rc.error) {
    $('contenido').innerHTML = `
      <button class="volver" data-accion="volver-clientes">← Volver a clientes</button>
      <div class="mensaje-error">No se pudo abrir el cliente: ${escapar(errorDB(rc.error))}</div>`;
    return;
  }

  fichaActual = {
    cliente: rc.data, polizas: rp.data || [], contactos: rh.data || [],
    siniestros: rs.error ? null : (rs.data || []), // null = la tabla todavía no existe
  };
  dibujarFicha();
}

function chipPoliza(p) {
  if (p.estado === 'baja') return '<span class="chip rojo">Dada de baja</span>';
  if (p.estado !== 'vigente') return `<span class="chip gris">${ESTADOS_POLIZA[p.estado]}</span>`;
  const dias = Math.round((aFecha(p.fecha_vencimiento) - aFecha(hoyISO())) / 86400000);
  if (dias > 30) return '<span class="chip verde">Vigente</span>';
  return `<span class="chip ${dias <= 15 ? 'rojo' : 'amarillo'}">${textoDias(dias)}</span>`;
}

function calcularEdad(fechaISO) {
  const nac = aFecha(fechaISO);
  const hoy = new Date();
  let edad = hoy.getFullYear() - nac.getFullYear();
  const cumplio = hoy.getMonth() > nac.getMonth() || (hoy.getMonth() === nac.getMonth() && hoy.getDate() >= nac.getDate());
  if (!cumplio) edad--;
  return edad;
}

function dibujarFicha() {
  const { cliente: c, polizas, contactos, siniestros } = fichaActual;
  const esEmpresa = c.tipo === 'empresa';
  const nombreDe = (lista, id) => lista.find((x) => x.id === id)?.nombre || '-';

  const dato = (etiqueta, valorHTML) => (valorHTML ? `<dt>${etiqueta}</dt><dd>${valorHTML}</dd>` : '');
  const domicilio = [c.direccion, c.localidad, c.provincia].filter(Boolean).join(', ');
  const datosHTML = [
    dato(esEmpresa ? 'CUIT' : 'DNI / CUIT', escapar(c.dni_cuit)),
    dato('Teléfono', c.telefono ? `<a href="tel:${escapar(c.telefono)}">${escapar(c.telefono)}</a>` : ''),
    dato('Email', c.email ? `<a href="mailto:${escapar(c.email)}">${escapar(c.email)}</a>` : ''),
    dato('Domicilio', escapar(domicilio)),
    esEmpresa ? '' : dato('Fecha de nacimiento', c.fecha_nacimiento ? `${formatearFecha(c.fecha_nacimiento)} (${calcularEdad(c.fecha_nacimiento)} años)` : ''),
    esEmpresa ? '' : dato('Estado civil', ESTADOS_CIVILES[c.estado_civil] || ''),
    esEmpresa ? '' : dato('Profesión', escapar(c.profesion)),
    esEmpresa ? '' : dato('Vencimiento del carnet', c.vencimiento_carnet ? `${formatearFecha(c.vencimiento_carnet)} ${chipCarnet(c.vencimiento_carnet)}` : ''),
    dato('Notas', escapar(c.notas)),
  ].join('');

  const filasPolizas = polizas.map((p) => `
    <tr class="fila-click" data-accion="editar-poliza" data-id="${p.id}">
      <td>${chipPoliza(p)}</td>
      <td>${escapar(nombreDe(companias, p.compania_id))}</td>
      <td>${escapar(nombreDe(ramos, p.ramo_id))}</td>
      <td>${escapar(p.numero_poliza) || '-'}</td>
      <td>${escapar(descripcionBien(p)) || '-'}</td>
      <td>${formatearFecha(p.fecha_vencimiento)}</td>
      <td>${NOMBRES_PAGO[p.forma_pago] || '-'}</td>
    </tr>`).join('');

  const historialHTML = contactos.map((h) => `
    <div class="historial-item">
      <div class="historial-icono">${TIPOS_CONTACTO[h.tipo].split(' ')[0]}</div>
      <div style="flex:1; min-width:0">
        <div class="historial-meta">${fechaHora(h.fecha)} · ${TIPOS_CONTACTO[h.tipo].split(' ').slice(1).join(' ')}${perfiles[h.created_by] ? ' · ' + escapar(perfiles[h.created_by]) : ''}</div>
        <div class="historial-detalle">${escapar(h.detalle)}</div>
      </div>
      <button class="btn-mini" data-accion="borrar-contacto" data-id="${h.id}" title="Eliminar" aria-label="Eliminar">✕</button>
    </div>`).join('');

  $('contenido').innerHTML = `
    <button class="volver" data-accion="volver-clientes">← Volver a clientes</button>
    <div class="cabecera-seccion">
      <div class="ficha-titulo">
        <h1 class="titulo-seccion">${escapar(c.nombre_mostrar)}</h1>
        <span class="chip ${esEmpresa ? 'azul' : 'gris'}">${esEmpresa ? 'Empresa' : 'Persona'}</span>
        ${c.activo === false ? '<span class="chip rojo">Dado de baja</span>' : ''}
        ${chipCarnet(c.vencimiento_carnet, true)}
        ${c.usuario_id && c.usuario_id !== usuarioId ? `<span class="chip violeta">Cartera de ${escapar(perfiles[c.usuario_id] || 'otro usuario')}</span>` : ''}
      </div>
      <div class="agenda-controles">
        <button class="btn-secundario" data-accion="agendar-cliente">📒 Agendar</button>
        <button class="btn-secundario" data-accion="nueva-venta-cliente">💼 Nueva venta</button>
        <button class="btn-secundario" data-accion="editar-cliente">✏️ Editar datos</button>
        ${c.activo === false ? '' : '<button class="btn-peligro" data-accion="baja-cliente">⛔ Dar de baja</button>'}
      </div>
    </div>
    ${c.activo === false ? `
      <div class="aviso-baja" style="margin-top:14px">⛔ Dado de baja el ${formatearFecha(c.fecha_baja)}${c.motivo_baja ? ' — ' + escapar(c.motivo_baja) : ''}
        <button class="btn-secundario" data-accion="reactivar-cliente">↩️ Reactivar cliente</button>
      </div>` : ''}

    <div class="ficha-layout">
      <div class="tarjeta">
        <div class="tarjeta-titulo">Datos</div>
        ${datosHTML ? `<dl class="datos-lista">${datosHTML}</dl>` : '<p class="bajada" style="margin:10px 0 0">Sin datos cargados. Tocá "Editar datos".</p>'}
        <div class="zona-peligro">
          <button class="btn-borrar-definitivo" data-accion="eliminar-cliente-definitivo" data-id="${c.id}">🗑️ Eliminar definitivamente</button>
        </div>
      </div>

      <div>
        <div class="panel">
          <div class="panel-titulo con-boton">
            <span>Pólizas (${polizas.length})</span>
            <button class="btn-principal btn-chico" data-accion="nueva-poliza">+ Nueva póliza</button>
          </div>
          ${polizas.length === 0
            ? vacio('📄', 'Este cliente todavía no tiene pólizas cargadas.')
            : `<div class="tabla-contenedor"><table>
                <thead><tr><th>Estado</th><th>Compañía</th><th>Tipo de seguro</th><th>N° póliza</th><th>Bien asegurado</th><th>Vencimiento</th><th>Pago</th></tr></thead>
                <tbody>${filasPolizas}</tbody>
              </table></div>`}
        </div>

        ${siniestros === null ? '' : `
        <div class="panel" style="margin-top:20px">
          <div class="panel-titulo con-boton">
            <span>Siniestros (${siniestros.length})</span>
            <button class="btn-secundario" data-accion="nuevo-siniestro-cliente">🚨 Nuevo siniestro</button>
          </div>
          ${siniestros.length === 0
            ? vacio('🚨', 'Este cliente no tiene siniestros cargados.')
            : `<div class="tabla-contenedor"><table>
                <thead><tr><th>Estado</th><th>Fecha</th><th>Tipo</th><th>Compañía</th><th>N° siniestro</th></tr></thead>
                <tbody>${siniestros.map((s) => `
                  <tr class="fila-click" data-accion="ver-siniestro" data-id="${s.id}">
                    <td>${chipSiniestro(s.estado)}</td>
                    <td>${formatearFecha(s.fecha_siniestro)}</td>
                    <td>${TIPOS_SINIESTRO[s.tipo] || s.tipo}</td>
                    <td>${escapar(nombreDe(companias, s.compania_id))}</td>
                    <td>${escapar(s.numero_siniestro) || '-'}</td>
                  </tr>`).join('')}</tbody>
              </table></div>`}
        </div>`}

        <div class="panel" style="margin-top:20px">
          <div class="panel-titulo">Historial de contactos</div>
          <form class="historial-form" id="form-contacto">
            <select name="tipo" aria-label="Tipo de contacto">
              ${Object.entries(TIPOS_CONTACTO).map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}
            </select>
            <textarea name="detalle" rows="1" required placeholder="¿Qué se habló? Ej: Le ofrecí seguro de hogar, pidió cotización"></textarea>
            <button class="btn-principal btn-chico" type="submit">Agregar</button>
          </form>
          ${historialHTML || vacio('💬', 'Todavía no hay contactos registrados.')}
        </div>
      </div>
    </div>`;

  $('form-contacto').addEventListener('submit', async (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    const boton = e.target.querySelector('button');
    boton.disabled = true;
    const { data, error } = await db.from('contactos')
      .insert({ cliente_id: c.id, tipo: d.tipo, detalle: d.detalle.trim() })
      .select().single();
    boton.disabled = false;
    if (error) { alert('No se pudo guardar: ' + errorDB(error)); return; }
    fichaActual.contactos.unshift(data);
    dibujarFicha();
  });
}

// =====================================================================
//  FORMULARIO DE PÓLIZA (nueva / editar)
// =====================================================================
// "sugerido": datos para precargar una póliza nueva (por ejemplo, desde una venta ganada)
function abrirFormPoliza(p = null, sugerido = {}) {
  const companiasDisponibles = companias.filter((x) => x.activa || x.id === p?.compania_id);
  if (companiasDisponibles.length === 0) {
    abrirModal({
      titulo: 'Falta cargar compañías',
      cuerpo: '<div class="aviso-info">Para cargar una póliza primero tiene que haber al menos una <strong>compañía de seguros</strong> cargada.</div>',
      onGuardar: async () => { irA('companias'); },
      textoGuardar: 'Ir a Compañías',
    });
    return;
  }
  const ramosDisponibles = ramos.filter((r) => r.activo || r.id === p?.ramo_id);
  const clienteId = fichaActual.cliente.id;

}

  const c = fichaActual.cliente;
  const vigentes = fichaActual.polizas.filter((p) => p.estado === 'vigente');
  const nombreDe = (lista, id) => lista.find((x) => x.id === id)?.nombre || '';

  abrirModal({
    titulo: `⛔ Dar de baja a ${c.nombre_mostrar}`,
    ancho: true,
    cuerpo: `
      <div class="aviso-info">El cliente no se borra: queda guardado en <strong>🗂️ Bajas</strong> con todos sus datos, por si más adelante querés ofrecerle algo.</div>
      ${camposMotivoBaja()}
      ${vigentes.length ? `
        <div class="seccion-form">¿Qué pólizas se dan de baja con él?</div>

          <label class="check-linea">

    textoGuardar: 'Dar de baja',
    onGuardar: async (d) => {
      if (!d.fecha_baja || !d.motivo) return 'Completá la fecha y el motivo.';
      const motivo = textoMotivo(d);
      const { error } = await db.from('clientes')
        .update({ activo: false, fecha_baja: d.fecha_baja, motivo_baja: motivo }).eq('id', c.id);
      if (error) return errorDB(error);
      const ids = vigentes.filter((p) => d[`poliza_${p.id}`] === 'on').map((p) => p.id);

      }
      verCliente(c.id);
    },
  });

function descargarCSV(nombreArchivo, columnas, filas) {
  const celda = (valor) => {
    const s = valor === null || valor === undefined ? '' : String(valor);
    return /[";\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  // Para que Excel no convierta DNI/CUIT o N° de póliza en números raros
  const comoTexto = (valor) => (valor ? `="${String(valor).replace(/"/g, '')}"` : '');

  const lineas = [columnas.map((c) => celda(c.titulo)).join(';')];
  filas.forEach((fila) => {
    lineas.push(columnas.map((c) => {
      const valor = c.valor(fila);
      return c.texto ? comoTexto(valor) : celda(valor);
    }).join(';'));
  });

  const blob = new Blob(['﻿' + lineas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${nombreArchivo}_${hoyISO()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// filas: [{ cliente, poliza }] (poliza puede ser null)
async function descargarCartera(nombreArchivo, filas) {
  const XLSX = await cargarXLSX();
  const matriz = [COLUMNAS_CARTERA.map(([titulo]) => titulo)];
  filas.forEach(({ cliente, poliza }) => {
    matriz.push(COLUMNAS_CARTERA.map(([, valor]) => {
      const x = valor(cliente, poliza);
      return x === null || x === undefined ? '' : (typeof x === 'number' ? x : String(x));
    }));
  });
  const hoja = XLSX.utils.aoa_to_sheet(matriz);
  hoja['!cols'] = COLUMNAS_CARTERA.map(([t]) => ({ wch: Math.max(12, t.length + 3) }));
  hoja['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: matriz.length - 1, c: COLUMNAS_CARTERA.length - 1 } }) };
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, 'Cartera');
  XLSX.writeFile(libro, `${nombreArchivo}_${hoyISO()}.xlsx`);
}

async function exportarClientes() {
  const boton = document.querySelector('[data-accion="exportar-clientes"]');
  const ids = idsBusquedaClientes;
  if (ids && ids.size === 0) { alert('No hay clientes para exportar con esta búsqueda.'); return; }
  try {
    if (boton) { boton.disabled = true; boton.textContent = '⬇️ Preparando...'; }
    const clientes = await traerTodos(() => consultaClientes(ids, '*, polizas(*)'));
    if (clientes.length === 0) { alert('No hay clientes para exportar con esta búsqueda.'); return; }
    // Una fila por póliza vigente; si no tiene, una fila solo con el cliente
    const filas = [];
    clientes.forEach((c) => {
      const vigentes = (c.polizas || []).filter((p) => p.estado === 'vigente')
        .sort((x, y) => (x.fecha_vencimiento || '').localeCompare(y.fecha_vencimiento || ''));
      if (vigentes.length) vigentes.forEach((p) => filas.push({ cliente: c, poliza: p }));
      else filas.push({ cliente: c, poliza: null });
    });
    await descargarCartera('clientes', filas);
  } catch (e) {
    alert('No se pudo exportar: ' + (e.code ? errorDB(e) : e.message || e));
  } finally {
    if (boton) { boton.disabled = false; boton.textContent = '⬇️ Exportar a Excel'; }
  }
}

  { id: '', nombre: 'Cualquier vencimiento' },
  { id: 'vencidas', nombre: 'Ya vencidas' },
  { id: '15', nombre: 'Vencen en 15 días' },
  { id: '30', nombre: 'Vencen en 30 días' },
  { id: '60', nombre: 'Vencen en 60 días' },
  { id: 'mes', nombre: 'Vencen este mes' },
];

  $('contenido').innerHTML = `
    <div class="cabecera-seccion">
      <div>
        <h1 class="titulo-seccion">Pólizas</h1>
        <p class="bajada">Todas las pólizas de todos los clientes. Tocá una para ir a la ficha del cliente.</p>

    if ($(id)) $(id).addEventListener('change', (e) => { filtroPol[clave] = e.target.value; buscarPolizas(); });
